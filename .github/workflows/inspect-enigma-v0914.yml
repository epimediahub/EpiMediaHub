name: Inspect Enigma v0.9.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-enigma-v0914.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live player and category refresh paths
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/inspect0914
          mkdir -p /tmp/inspect0914/ar /tmp/inspect0914/data
          cd /tmp/inspect0914/ar
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.14.ipk"
          tar -xzf data.tar.gz -C ../data
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/inspect0914/data/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub/plugin.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          starts=[]
          for needle in ('class EpiLivePlayer','def save_recent_entry','class EpiCategoryScreen','class EpiContentScreen'):
              for i,line in enumerate(lines):
                  if needle in line:
                      starts.append((needle,i))
                      break
          for needle,i in starts:
              before=45 if 'save_recent' in needle else 15
              after={'class EpiLivePlayer':260,'def save_recent_entry':100,'class EpiCategoryScreen':360,'class EpiContentScreen':260}.get(needle,120)
              a=max(0,i-before); b=min(len(lines),i+after)
              print(f'===== {needle} LINES {a+1}-{b} =====')
              for j in range(a,b):
                  print(f'{j+1:05d}: {lines[j]}')
          PY
