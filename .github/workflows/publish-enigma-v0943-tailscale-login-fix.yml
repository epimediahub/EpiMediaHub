name: Publish Enigma v0.9.43 Tailscale Login Fix

on:
  push:
    paths:
      - 'build_tools/build_v0943_tailscale_login_fix.sh'
      - '.github/workflows/publish-enigma-v0943-tailscale-login-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish v0.9.43
        shell: bash
        run: bash build_tools/build_v0943_tailscale_login_fix.sh
