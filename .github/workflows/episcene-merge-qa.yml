name: EpiScene targeted merge safety

on:
  push:
    branches: [feature/episcene-provider-series-intros]
    paths:
      - 'server/epimediahub_provisioning/deploy/install_episcene_multi_intro_safe.py'
      - '.github/workflows/episcene-merge-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate patcher syntax
        run: python -m py_compile server/epimediahub_provisioning/deploy/install_episcene_multi_intro_safe.py
      - name: Verify targeted merge with exact reference and independent modifications
        run: python server/epimediahub_provisioning/deploy/install_episcene_multi_intro_safe.py selftest
