name: Inspect v0.9.25 Family PIN

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-v0925-family-pin.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract PIN-related plugin sections
        run: |
          set -e
          rm -rf /tmp/epiinspect
          mkdir -p /tmp/epiinspect
          cd /tmp/epiinspect
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.25.ipk"
          tar -xzf data.tar.gz
          PLUGIN="usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub/plugin.py"
          mkdir -p "$GITHUB_WORKSPACE/inspection"
          python3 - "$PLUGIN" "$GITHUB_WORKSPACE/inspection/v0925-family-pin.txt" <<'PY'
          import re,sys
          p=sys.argv[1]; out=sys.argv[2]
          lines=open(p,encoding='utf-8').read().splitlines()
          needles=('FAMILY_PIN_HASH','class EpiPinScreen','family_skins_unlocked','_familyPinEntered','Family · Rai','kind\") == \"rai\"','kind\")==\"rai\"','openWithCallback')
          hits=[]
          for i,line in enumerate(lines):
              if any(n in line for n in needles):
                  a=max(0,i-25); b=min(len(lines),i+45)
                  hits.append((a,b))
          merged=[]
          for a,b in sorted(hits):
              if merged and a<=merged[-1][1]: merged[-1]=(merged[-1][0],max(merged[-1][1],b))
              else: merged.append((a,b))
          with open(out,'w',encoding='utf-8') as f:
              for a,b in merged:
                  f.write(f'===== lines {a+1}-{b} =====\n')
                  for j in range(a,b): f.write(f'{j+1:05d}: {lines[j]}\n')
                  f.write('\n')
          PY
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection/v0925-family-pin.txt
          git commit -m 'Inspect v0.9.25 family PIN paths'
          git push
