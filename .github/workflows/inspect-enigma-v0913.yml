name: Inspect Enigma v0.9.13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-enigma-v0913.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PROFILE_SKIN
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/inspect0913
          mkdir -p /tmp/inspect0913/ar /tmp/inspect0913/data
          cd /tmp/inspect0913/ar
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.13.ipk"
          tar -xzf data.tar.gz -C ../data
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/inspect0913/data/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub/plugin.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines):
              if line.startswith('PROFILE_SKIN'):
                  a=max(0,i-10); b=min(len(lines),i+100)
                  print(f'===== LINES {a+1}-{b} =====')
                  for j in range(a,b):
                      print(f'{j+1:05d}: {lines[j]}')
                  break
          PY
