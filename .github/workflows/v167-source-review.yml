name: v167 private playback and history source inspection
on:
  push:
    branches: [feature/v167-private-playback-vpn-qa]
    paths:
      - '.github/workflows/v167-source-review.yml'
  pull_request:
    branches: [fix/v166-epg-now-parsing-full-fallback]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compile-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      EPIMEDIAHUB_OFFICIAL_CANDIDATE: '1'
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4eb73efd17b28fecbb824875137e43cede07c27f
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-v164-overlay
      - name: Add v163 candidate files
        run: |
          cp -a .ci-v164-overlay/android/v1.0.61 android/v1.0.61
          cp -a .ci-v164-overlay/android/v1.0.62 android/v1.0.62
          cp -a .ci-v164-overlay/android/v1.0.63 android/v1.0.63
          cp -a .ci-v164-overlay/android/v1.0.64 android/v1.0.64
          cp -a .ci-v164-overlay/android/v1.0.65 android/v1.0.65
          cp -a .ci-v164-overlay/android/v1.0.66 android/v1.0.66
          cp .ci-v164-overlay/build_tools/render_intro_synced.py build_tools/
          cp .ci-v164-overlay/build_tools/prepare_intro_synced.py build_tools/
          cp .ci-v164-overlay/build_tools/render_intro_orchestral_preview.py build_tools/
          cp .ci-v164-overlay/build_tools/prepare_intro_orchestral.py build_tools/
      - name: Prepare pinned orchestral soundtrack with the approved picture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1
          command -v ffmpeg >/dev/null || { sudo apt-get update; sudo apt-get install -y ffmpeg; }
          python3 build_tools/prepare_intro_orchestral.py
          python3 build_tools/prepare_intro_synced.py
      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* | base64 -d > .ci-android/source.tar.gz
          test "$(sha256sum .ci-android/source.tar.gz | awk '{print $1}')" = "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Pin Android toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF
      - name: Apply v149 through v163 patches
        shell: bash
        run: |
          set -euo pipefail
          bash build_tools/install_android_v1033_source.sh
          python3 android/v1.0.34-vpn/patch_wireguard_spike.py
          python3 android/v1.0.34-vpn/patch_playlist_routing.py
          for v in 149 150 151 152 153 154 155 156 157 158 159 160 161 162 163; do
            python3 "android/v1.0.$((10#$v - 100))/patch_v$v.py"
          done
      - name: Record reconstructed v163 player source for lifecycle inspection
        shell: bash
        run: |
          mkdir -p qa-source
          cp "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt" qa-source/
          cp "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/EpiMediaHubApp.kt" qa-source/
          cp "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt" qa-source/
          cp "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/Common.kt" qa-source/
          cp "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/XtreamClient.kt" qa-source/
      - uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub-v166-baseline-source
          path: qa-source/
          retention-days: 7
      - name: Apply v164 retained playback and restore v166 EPG
        run: |
          python3 android/v1.0.64/patch_v164.py
          python3 android/v1.0.65/patch_v165.py
          python3 android/v1.0.66/patch_v166.py
      - name: Inspect actual v166 playback and history code
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          root=pathlib.Path(os.environ['PROJECT_ROOT'])/'app/src/main/java/de/epimediahub/app'
          patterns=re.compile(r'continueItems|recentlyWatched|recentlyViewed|recentItems|watchHistory|WatchHistory|continueWatching|ContinueWatching|V121VodSurface|ExoPlayer|SurfaceView|onDroppedVideoFrames|setVideoFrameRate|setFrameRate|MediaCodec|Decoder|playbackPosition|resumeKey|watchProgress|watchState|history',re.I)
          for path in root.rglob('*.kt'):
              if path.name in ('MainViewModel.kt','EpiMediaHubApp.kt','PlayerScreen.kt','V060CinematicHub.kt') or path.name.lower().find('watch')>=0 or path.name.lower().find('player')>=0:
                  ls=path.read_text().splitlines()
                  indices=[i for i,s in enumerate(ls) if patterns.search(s)]
                  if not indices: continue
                  take=set()
                  for i in indices[:65]:
                      take.update(range(max(0,i-4),min(len(ls),i+6)))
                  print('===',path.relative_to(root),'LENGTH',len(ls),'===')
                  for i in sorted(take): print(f'{i+1}: {ls[i][:240]}')
          PY
      - name: Inspect watch history persistence and video surface definitions
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,os,re
          root=pathlib.Path(os.environ['PROJECT_ROOT'])/'app/src/main/java/de/epimediahub/app'
          anchors=('fun loadContinue(', 'fun loadRecentlyWatched(', 'fun recordRecentlyWatched(',
                   'fun savePlayback(', 'fun V121VodSurface(', 'fun ContinueWatchingScreen(',
                   'fun V060RecentlyWatchedScreen(', 'fun V060CinematicHubScreen(',
                   'fun V071VlcLivePlayer(', 'fun V071VlcPlayer(',
                   'val player = remember(', 'PlayerView(context)', 'PlayerView(',
                   'fun loadRecently', 'fun loadContinue')
          for path in root.rglob('*.kt'):
              lines=path.read_text().splitlines()
              indices=[i for i,line in enumerate(lines) if any(a in line for a in anchors)]
              if not indices: continue
              print('===FILE===',path.relative_to(root),len(lines))
              selected=set()
              for i in indices[:12]:
                  selected.update(range(max(0,i-10),min(len(lines),i+125)))
              for i in sorted(selected): print(str(i+1)+': '+lines[i][:260])
          PY
