name: Inspect Enigma v0.9.41 Runtime

on:
  push:
    paths:
      - '.github/workflows/inspect-v0941-runtime.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current plugin runtime
        shell: bash
        run: |
          set -e
          T=/tmp/inspect0941
          rm -rf "$T" && mkdir -p "$T"
          cd "$T"
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.41.ipk"
          mkdir data && tar -xzf data.tar.gz -C data
          P="$T/data/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub/plugin.py"
          echo '=== VERSION / STREAM REFS ==='
          grep -n -C 18 'eServiceReference(1,0,url)\|eServiceReference(1, 0,.*url' "$P" || true
          echo '=== MEDIATHEK PLAYER ==='
          grep -n -A 140 -B 20 'class EpiMediathekPlayer' "$P" || true
          echo '=== SETTINGS / HOME CLASSES ==='
          grep -n 'class .*Settings\|class EpiMediaHubHome\|Einstellungen\|Settings' "$P" | tail -n 120 || true
          echo '=== HOME MENU AREA ==='
          grep -n -A 220 -B 30 'class EpiMediaHubHome' "$P" || true
