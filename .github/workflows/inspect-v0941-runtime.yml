name: Inspect Enigma v0.9.41 Runtime

on:
  push:
    paths:
      - '.github/workflows/inspect-v0941-runtime.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current plugin runtime
        shell: bash
        run: |
          set -e
          T=/tmp/inspect0941
          rm -rf "$T" && mkdir -p "$T"
          cd "$T"
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.41.ipk"
          mkdir data && tar -xzf data.tar.gz -C data
          P="$T/data/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub/plugin.py"
          echo '=== SETTINGS CLASS ==='
          sed -n '11102,11680p' "$P"
          echo '=== IMPORTS ==='
          sed -n '1,180p' "$P"
          echo '=== QR HELPERS ==='
          grep -n -A 50 -B 20 'qrcode\|QR' "$P" | head -n 280 || true
