name: Cleanup old Android test release assets

on:
  push:
    branches: [android-v0.7.0-ui]
    paths:
      - 'android/cleanup-release-assets-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only Android 0.8.6 through 0.8.9 APK assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.7.0-test"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | [.id,.name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            case "$name" in
              EpiMediaHub_Android_v0.7.0-test.apk|android-latest.json|latest.json|SHA256SUMS.txt)
                echo "KEEP current alias/metadata: $name"
                continue
                ;;
              EpiMediaHub_Android_v0.8.6-test-*.apk|EpiMediaHub_Android_v0.8.7-test-*.apk|EpiMediaHub_Android_v0.8.8-test-*.apk|EpiMediaHub_Android_v0.8.9-test-*.apk)
                echo "KEEP retained build: $name"
                continue
                ;;
            esac
            if [[ "$name" == EpiMediaHub_Android_v*-test*.apk ]]; then
              echo "DELETE old APK: $name"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            else
              echo "KEEP unrelated asset: $name"
            fi
          done
