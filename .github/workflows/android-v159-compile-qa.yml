name: EpiMediaHub v1.0.59 Android compile QA (no release)
on:
  push:
    branches: [feature/v159-live-remote-hold-seek]
    paths:
      - 'android/v1.0.59/**'
      - '.github/workflows/android-v159-compile-qa.yml'
  pull_request:
    branches: [release/v157-unified-playback-recent]
    paths:
      - 'android/v1.0.59/**'
      - '.github/workflows/android-v159-compile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      EPIMEDIAHUB_OFFICIAL_CANDIDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* | base64 -d > .ci-android/source.tar.gz
          test "$(sha256sum .ci-android/source.tar.gz | awk '{print $1}')" = "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Pin Android toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF
      - name: Apply v149 through v159 patches
        shell: bash
        run: |
          set -euo pipefail
          bash build_tools/install_android_v1033_source.sh
          python3 android/v1.0.34-vpn/patch_wireguard_spike.py
          python3 android/v1.0.34-vpn/patch_playlist_routing.py
          for v in 149 150 151 152 153 154 155 156 157 158 159; do
            python3 "android/v1.0.$((10#$v - 100))/patch_v$v.py"
          done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore Android audio native cache
        id: audio-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.PROJECT_ROOT }}/ffmpeg-audio/src/main/jni/ffmpeg/android-libs
            ${{ env.PROJECT_ROOT }}/ffmpeg-6.1.6.tar.xz
          key: audio-ffmpeg-6.1.6-ndk26b-api25-${{ runner.os }}-${{ hashFiles('build_tools/build_android_audio_v123.sh', 'android/v1.0.23/upstream.json') }}
      - name: Prepare audio-only Android native dependencies
        run: bash build_tools/build_android_audio_v123.sh
      - name: Check compilation for v1.0.59 without any release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle :app:compileDebugKotlin --no-daemon --stacktrace -Dorg.gradle.workers.max=2
      - name: Execute boot preference Robolectric test
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle :app:testDebugUnitTest --tests 'de.epimediahub.app.ui.V159BootAutostartTest' --no-daemon --stacktrace -Dorg.gradle.workers.max=2
