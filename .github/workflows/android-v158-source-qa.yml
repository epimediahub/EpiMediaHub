name: EpiMediaHub v1.0.58 source integrity and recent-media regression

on:
  push:
    branches: [release/v157-unified-playback-recent]
    paths:
      - 'android/v1.0.58/**'
      - '.github/workflows/android-v158-source-qa.yml'
      - '.github/workflows/android-v158-official-qa.yml'
      - '.github/workflows/v158-official-inapp-updater.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct pinned application source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 -d .ci-android/source.b64 > .ci-android/source.tar.gz
          test "$(sha256sum .ci-android/source.tar.gz | awk '{print $1}')" = "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Reconstruct official v1.0.57 then apply isolated v1.0.58 fixes
        shell: bash
        run: |
          set -euo pipefail
          bash build_tools/install_android_v1033_source.sh
          python3 android/v1.0.34-vpn/patch_wireguard_spike.py
          python3 android/v1.0.34-vpn/patch_playlist_routing.py
          python3 android/v1.0.49/patch_v149.py
          python3 android/v1.0.50/patch_v150.py
          python3 android/v1.0.51/patch_v151.py
          python3 android/v1.0.52/patch_v152.py
          python3 android/v1.0.53/patch_v153.py
          python3 android/v1.0.54/patch_v154.py
          python3 android/v1.0.55/patch_v155.py
          python3 android/v1.0.56/patch_v156.py
          python3 android/v1.0.57/patch_v157.py
          python3 android/v1.0.58/patch_v158.py
      - name: Inspect production Xtream added-date decoding and category selection
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["PROJECT_ROOT"])/"app/src/main/java/de/epimediahub/app"
          for name in ["data/XtreamClient.kt", "model/Models.kt", "ui/V060CinematicHub.kt", "MainViewModel.kt"]:
              p=root/name
              s=p.read_text().splitlines()
              if name.endswith("XtreamClient.kt"):
                  matches=[i for i,line in enumerate(s) if 'fun entries(' in line or 'addedAt =' in line or 'date_added' in line or 'optLong("added")' in line]
              elif name.endswith("Models.kt"): matches=[i for i,line in enumerate(s) if 'addedAt:' in line]
              elif name.endswith("V060CinematicHub.kt"): matches=[i for i,line in enumerate(s) if 'val newest =' in line or 'val visibleCategories =' in line]
              else: matches=[i for i,line in enumerate(s) if 'V158RecentlyAdded.select' in line]
              print("SOURCE_DIAGNOSTIC",name)
              ranges=set()
              for i in matches[:14]:
                  for k in range(max(0,i-4),min(len(s),i+11)): ranges.add(k)
              for k in sorted(ranges): print(f"{k+1}: {s[k]}")
          PY
      - name: Validate source version, provider dates, synthetic category and playback preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          r=Path(os.environ['PROJECT_ROOT'])
          j=r/'app/src/main/java/de/epimediahub/app'
          build=(r/'app/build.gradle.kts').read_text()
          assert 'versionCode = 1058' in build
          assert 'versionName = "1.0.58"' in build
          recent=(j/'data/V158RecentlyAdded.kt').read_text()
          assert '.filter { it.addedAt > 0L }' in recent
          assert '.sortedByDescending { it.addedAt }' in recent
          assert 'all.take' not in recent
          vm=(j/'MainViewModel.kt').read_text()
          assert 'V158RecentlyAdded.select(all, 36)' in vm
          assert 'V158RecentlyAdded.select(all, 300)' in vm
          home=(j/'ui/V083Home.kt').read_text()
          assert 'BuildConfig.VERSION_NAME' in home
          assert 'ANDROID TV · 1.0.33' not in home
          hub=(j/'ui/V060CinematicHub.kt').read_text()
          assert 'val recentCategory =' in hub
          assert 'de.epimediahub.app.model.MediaCategory("__recently_added__"' in hub
          assert (r/'app/src/test/java/de/epimediahub/app/data/V158RecentlyAddedTest.kt').is_file()
          player=(j/'ui/PlayerScreen.kt').read_text()
          assert 'val nextCandidate = activeUrl + 1' in player
          xtream=(j/'data/XtreamClient.kt').read_text()
          assert 'V158ProviderDates.fromRow(o, kind)' in xtream
          assert 'showContinue = continueItems.isNotEmpty()' in hub
          assert 'title = "Weiterschauen"' in hub
          assert (r/'app/src/test/java/de/epimediahub/app/data/V158ProviderDatesTest.kt').is_file()
          assert 'V156ExactM3uCache.resolve(' in xtream
          assert 'V156ExactM3uCache.warm(' in xtream
          assert 'V153DirectPolicy.canPlay' in (j/'vpn/V134VpnSession.kt').read_text()
          print('SOURCE CHECK OK')
          PY
