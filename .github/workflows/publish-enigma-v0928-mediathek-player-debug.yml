name: Publish Enigma v0.9.28 Mediathek Player Fix
on:
  push:
    paths:
      - 'build_tools/build_v0928_mediathek_player_debug.sh'
      - '.github/workflows/publish-enigma-v0928-mediathek-player-debug.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.28
        run: bash build_tools/build_v0928_mediathek_player_debug.sh
