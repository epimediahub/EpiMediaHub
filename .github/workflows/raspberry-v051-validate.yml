name: Validate Raspberry v0.5.1 backend

on:
  workflow_dispatch:
  push:
    branches: [raspberry-v0.5.1-domain]
    paths:
      - 'server/epimediahub_provisioning/**'
      - '.github/workflows/raspberry-v051-validate.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r server/epimediahub_provisioning/requirements.txt
      - name: Compile Python sources
        run: |
          python -m py_compile \
            server/epimediahub_provisioning/app.py \
            server/epimediahub_provisioning/wsgi.py \
            server/epimediahub_provisioning/receiver_sync.py
      - name: Run v0.5.1 provisioning smoke test
        run: python server/epimediahub_provisioning/tests/smoke_v051.py
      - name: Validate upgrade script syntax
        run: bash -n server/epimediahub_provisioning/deploy/upgrade_to_v051.sh
