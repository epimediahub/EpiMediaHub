name: Build EpiMediaHub Android 0.9.9 private skins

on:
  workflow_dispatch:
  push:
    branches: [android-v0.9.9-private-skins]
    paths:
      - '.github/workflows/android-v099-check.yml'
      - 'android/v0.9.9/**'
      - 'android/v0.6.3/patch_v063_player.py'
      - 'build_tools/install_android_v063_source.sh'
      - 'build_tools/install_android_v099_source.sh'
  pull_request:
    branches: [android-v0.7.0-ui]
    paths:
      - '.github/workflows/android-v099-check.yml'
      - 'android/v0.9.9/**'
      - 'android/v0.6.3/patch_v063_player.py'
      - 'build_tools/install_android_v063_source.sh'
      - 'build_tools/install_android_v099_source.sh'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* | base64 --decode > .ci-android/source.tar.gz
          echo '192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c  .ci-android/source.tar.gz' | sha256sum -c -
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Pin Gradle toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF

      - name: Install 0.9.9 private skins
        run: bash build_tools/install_android_v099_source.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub-Android-v0.9.9-private-skins-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure permanent signing for update test
        if: github.event_name == 'push'
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/epimediahub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias epimediahub >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PROJECT_ROOT']) / 'app/build.gradle.kts'
          s = p.read_text()
          anchor = '    buildTypes {\n'
          signing = '''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = "epimediahub"
                  keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
              }
          }

          '''
          if anchor not in s:
              raise SystemExit('buildTypes anchor missing')
          s = s.replace(anchor, signing + anchor, 1)
          release = '        release {\n'
          if release not in s:
              raise SystemExit('release build type missing')
          s = s.replace(release, release + '            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s)
          PY

      - name: Build signed update APKs
        if: github.event_name == 'push'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd "$PROJECT_ROOT"
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Upload signed update APKs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub-Android-v0.9.9-private-skins-signed
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
