name: Publish Enigma v0.9.41 Rescue

on:
  push:
    paths:
      - 'build_tools/build_v0941_rescue_0938.sh'
      - '.github/workflows/publish-enigma-v0941-rescue.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.41 rescue
        shell: bash
        run: bash build_tools/build_v0941_rescue_0938.sh

# Rescue workflow: intentionally based on the exact v0.9.38 runtime.
