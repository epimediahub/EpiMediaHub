name: EpiMediaHub 1.0.55 GalaBox source inspection

on:
  push:
    branches: [fix/v155-galabox-direct-playback]
    paths:
      - '.github/workflows/v155-galabox-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct pinned v1.0.54 source and check playback anchors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 -d .ci-android/source.b64 > .ci-android/source.tar.gz
          test "$(sha256sum .ci-android/source.tar.gz | awk '{print $1}')" = "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          export PROJECT_ROOT
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_ROOT"
          bash build_tools/install_android_v1033_source.sh
          python3 android/v1.0.34-vpn/patch_wireguard_spike.py
          python3 android/v1.0.34-vpn/patch_playlist_routing.py
          python3 android/v1.0.49/patch_v149.py
          python3 android/v1.0.50/patch_v150.py
          python3 android/v1.0.51/patch_v151.py
          python3 android/v1.0.52/patch_v152.py
          python3 android/v1.0.53/patch_v153.py
          python3 android/v1.0.54/patch_v154.py
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          src=Path(os.environ["PROJECT_ROOT"])/"app/src/main/java/de/epimediahub/app"
          targets=[
             (src/"data/XtreamClient.kt", ["fun streamCandidates(", "fun entries("],200),
             (src/"ui/PlayerScreen.kt",["fun PlayerScreen(", "fun openUrl(", "onPlayerError(", "V071VlcLivePlayer("],80),
             (src/"ui/V088VlcVideo.kt",["key(url, userAgent, referer)", "onDispose"],35),
             (src/"MainViewModel.kt",["fun playbackUrls(", "fun switchLiveChannel("],32),
          ]
          for file,anchors,maximum in targets:
            s=file.read_text()
            lines=s.splitlines()
            print("\n###",file.name,"###")
            for anchor in anchors:
              matches=[i for i,l in enumerate(lines) if anchor in l]
              print("ANCHOR",anchor,"count",len(matches))
              for at in matches[:2]:
                # Only source fragments, no runtime URL, credentials, or playlist data.
                block=lines[max(0,at-4):min(len(lines),at+maximum)]
                for n,t in enumerate(block,start=max(0,at-4)+1):
                  print(str(n)+":",t)
                print("---")
          PY
