name: Inspect v0.9.34 Playlist Anchors

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-v0934-playlist-anchors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print exact playlist anchors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/epiinspect2 && mkdir -p /tmp/epiinspect2/ar /tmp/epiinspect2/data
          cd /tmp/epiinspect2/ar
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.34.ipk"
          tar -xzf data.tar.gz -C ../data
          P=/tmp/epiinspect2/data/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub/plugin.py
          export P
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=Path(os.environ['P']).read_text(encoding='utf-8').splitlines()
          print('=== IMPORTS 1-140 ===')
          for i in range(min(140,len(lines))): print('%05d %s'%(i+1,lines[i]))
          def show(title,pattern,before=12,after=55,limit=6):
              print('\n=== '+title+' ===')
              rx=re.compile(pattern,re.I)
              hits=[i for i,l in enumerate(lines) if rx.search(l)]
              print('HITS', [x+1 for x in hits[:20]])
              for i in hits[:limit]:
                  a=max(0,i-before); b=min(len(lines),i+after)
                  print('\n--- %d-%d ---'%(a+1,b))
                  for j in range(a,b): print('%05d %s'%(j+1,lines[j]))
          show('PLAYLIST CONSTANTS',r'PLAYLIST_DIR|DEFAULT_PLAYLIST|PLAYLIST_URL_FILE|M3U_URL_DEFAULT',8,30,5)
          show('PLAYLIST URL HELPERS',r'^def (load_playlist_url|load_playlist_url2|save_settings|ensure_config_dir|download_playlist)\b',5,90,12)
          show('PLAYLIST CLASSES',r'^class .*?(Playlist|Settings)',5,160,12)
          show('SWITCH PLAYLIST',r'def .*playlist|switch_playlist|active_playlist',8,90,12)
          show('NO PLAYLIST / STARTUP',r'not os\.path\.exists\(.*playlist|no playlist|keine playlist|DEFAULT_PLAYLIST|download_playlist\(',10,65,20)
          show('HOME OK ACTION',r'def keyOK|def ok|currentIndex == 3|switchPlaylist|switch_playlist',8,85,15)
          PY
