name: Publish Enigma v0.9.41 Web Setup Modal Fix

on:
  push:
    paths:
      - 'build_tools/build_v0941_websetup_modal_fix.sh'
      - '.github/workflows/publish-enigma-v0941-websetup-modal-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish v0.9.41
        shell: bash
        run: bash build_tools/build_v0941_websetup_modal_fix.sh
