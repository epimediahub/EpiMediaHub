name: EpiScene shadow reference engine tests
on:
  pull_request:
    paths:
      - 'tools/episcene-learning-v1/active-shadow/**'
      - '.github/workflows/episcene-shadow-reference-check.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/episcene-learning-v1/active-shadow/**'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test owner-attested shadow learning and read-only safety
        working-directory: tools/episcene-learning-v1/active-shadow
        run: python3 -m unittest -v test_reference_engine.py test_visual_gate_readonly.py test_visual_shadow_capture.py test_visual_progress_report.py test_visual_transition_compare.py
      - name: Check module syntax
        working-directory: tools/episcene-learning-v1/active-shadow
        run: python3 -m py_compile reference_engine.py visual_gate_readonly.py visual_shadow_capture.py visual_progress_report.py visual_transition_compare.py
      - name: Validate installer shell syntax
        working-directory: tools/episcene-learning-v1/active-shadow
        run: bash -n install.sh install_visual_capture.sh
