name: Publish Enigma v0.9.34 Mediathek Home Back + Layout

on:
  push:
    branches: [ main ]
    paths:
      - 'build_tools/build_v0934_mediathek_home_back_layout_v2.sh'
      - '.github/workflows/publish-enigma-v0934-mediathek-home-back-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.34
        run: bash build_tools/build_v0934_mediathek_home_back_layout_v2.sh
