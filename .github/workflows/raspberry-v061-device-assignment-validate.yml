name: Validate Raspberry v0.6.1 device assignment

on:
  workflow_dispatch:
  push:
    branches: [raspberry-v0.6.1-device-assignment]
    paths:
      - 'server/epimediahub_provisioning/**'
      - '.github/workflows/raspberry-v061-device-assignment-validate.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r server/epimediahub_provisioning/requirements.txt
      - name: Compile Python sources
        run: |
          python -m py_compile \
            server/epimediahub_provisioning/app.py \
            server/epimediahub_provisioning/wsgi.py \
            server/epimediahub_provisioning/receiver_sync.py \
            server/epimediahub_provisioning/dashboard_v052.py \
            server/epimediahub_provisioning/dashboard_v060.py \
            server/epimediahub_provisioning/dashboard_v061.py
      - name: Run v0.6.1 device assignment smoke test
        run: python server/epimediahub_provisioning/tests/smoke_v061.py
