name: Publish Enigma v0.9.31 Mediathek Manual Pop

on:
  push:
    branches: [main]
    paths:
      - 'build_tools/build_v0931_mediathek_manual_pop.sh'
      - '.github/workflows/publish-enigma-v0931-mediathek-manual-pop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.31
        run: bash build_tools/build_v0931_mediathek_manual_pop.sh
