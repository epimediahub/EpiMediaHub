name: Validate Raspberry v0.8.2 reviewed skip markers

on:
  workflow_dispatch:
  push:
    branches: [raspberry-v0.8.2-skip-markers]
    paths:
      - 'server/epimediahub_provisioning/**'
      - '.github/workflows/raspberry-v082-skip-validate.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and audio dependencies
        run: |
          python -m pip install -r server/epimediahub_provisioning/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint1
      - name: Validate Python and upgrade script
        run: |
          python -m compileall -q server/epimediahub_provisioning
          bash -n server/epimediahub_provisioning/deploy/upgrade_to_v082.sh
      - name: Verify existing dashboard, customers, devices and reseller isolation
        env:
          EPIMEDIAHUB_EXPECTED_API_VERSION: '0.8.2'
        run: python server/epimediahub_provisioning/tests/smoke_v080.py
      - name: Verify reviewed markers, source isolation and real audio matching
        run: python server/epimediahub_provisioning/tests/smoke_v082.py
