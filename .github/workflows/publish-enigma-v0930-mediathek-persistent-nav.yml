name: Publish Enigma v0.9.30 Mediathek Persistent Navigation

on:
  push:
    branches: [main]
    paths:
      - 'build_tools/build_v0930_mediathek_persistent_nav.sh'
      - '.github/workflows/publish-enigma-v0930-mediathek-persistent-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.30
        run: bash build_tools/build_v0930_mediathek_persistent_nav.sh
