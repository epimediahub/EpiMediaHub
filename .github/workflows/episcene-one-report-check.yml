name: EpiScene one-read-only-report diagnostics
on:
  push:
    paths:
      - 'tools/episcene-learning-v1/diagnostics/**'
      - '.github/workflows/episcene-one-report-check.yml'
  pull_request:
    paths:
      - 'tools/episcene-learning-v1/diagnostics/**'
      - '.github/workflows/episcene-one-report-check.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check read-only data privacy, ownership and rerun-gate diagnostics
        working-directory: tools/episcene-learning-v1/diagnostics
        run: |
          python3 -m py_compile one_report.py runtime_deadlines.py release_gap_readonly.py failure_visual_audit.py failure_template_triage.py http405_age_readonly.py private_failure_reason.py
          python3 -m unittest -v test_one_report.py test_runtime_deadlines.py test_failure_visual_audit.py test_release_gap_readonly.py test_failure_template_triage.py test_http405_age_readonly.py test_private_failure_reason.py
