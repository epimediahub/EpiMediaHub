name: Inspect Android Base Source

on:
  push:
    paths:
      - 'build_tools/inspect_android_base.sh'
      - '.github/workflows/inspect-android-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Android base source
        shell: bash
        run: bash build_tools/inspect_android_base.sh
