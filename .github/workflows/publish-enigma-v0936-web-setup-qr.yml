name: Publish Enigma v0.9.36 QR Web Playlist Setup

on:
  push:
    branches: [ main ]
    paths:
      - 'build_tools/build_v0936_web_setup_qr.sh'
      - '.github/workflows/publish-enigma-v0936-web-setup-qr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.36
        run: bash build_tools/build_v0936_web_setup_qr.sh
