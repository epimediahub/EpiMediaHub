name: Verify Android 1.0.33 public updater
on:
  push:
    branches: [android-v1.0.33-updater-diagnose]
    paths: [.github/workflows/android-v1033-updater-diagnose.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: epimediahub-android-v1033-final-verification
  cancel-in-progress: true
jobs:
  verify-public-updater:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f521c96aaafcbb58b5ebbbf18b8cf943e05c0d0
      - name: Read original signed build assets
        uses: actions/download-artifact@v4
        with:
          name: EpiMediaHub-Android-v1.0.33-signed-test-release
          path: dist
          run-id: 37489592470
          github-token: ${{ github.token }}
      - name: Read original completed regression reports
        uses: actions/download-artifact@v4
        with:
          name: android-v1033-release-test-reports
          path: reports
          run-id: 37489592470
          github-token: ${{ github.token }}
      - name: Verify updater and all three public APKs against signed build
        run: python3 build_tools/verify_android_release_v133.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-v1033-live-verification
          path: android-v1033-live-verification.json
          retention-days: 90
          if-no-files-found: error
