name: Android 1.0.33 updater diagnostics
on:
  push:
    branches: [android-v1.0.33-updater-diagnose]
    paths: [.github/workflows/android-v1033-updater-diagnose.yml]
permissions:
  contents: read
jobs:
  inspect-public-mirror:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Read public updater and sync status
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          from datetime import datetime, timezone
          base = 'https://download.epimediahub.com/android/'
          print('CHECKED AT', datetime.now(timezone.utc).isoformat(), flush=True)
          for filename in ('sync-status.json', 'latest.json', 'android-latest.json'):
              url = base + filename
              for bust in (False, True):
                  request = urllib.request.Request(url + ('?v133check=' + str(int(datetime.now(timezone.utc).timestamp())) if bust else ''),
                      headers={'Cache-Control':'no-cache', 'User-Agent':'EpiMediaHub-Updater-Diagnostic/1.0.33'})
                  try:
                      with urllib.request.urlopen(request, timeout=25) as response:
                          data = json.load(response)
                          print(filename, 'cache_bust', bust, 'HTTP', response.status,
                              'headers', {k:response.headers.get(k) for k in ('Cache-Control','Age','Server','Last-Modified','CF-Cache-Status')},
                              'data', json.dumps(data, ensure_ascii=False), flush=True)
                  except Exception as error:
                      print(filename, 'cache_bust', bust, type(error).__name__, str(error), flush=True)
          request = urllib.request.Request(base+'EpiMediaHub_Android_v1.0.33-arm64-v8a.apk', method='HEAD')
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  print('APK HEAD', response.status, response.headers.get('Content-Length'), flush=True)
          except Exception as error:
              print('APK HEAD', type(error).__name__, str(error), flush=True)
          PY
