name: Inspect Enigma v0.9.38 Audio Paths

on:
  push:
    paths:
      - '.github/workflows/inspect-enigma-v0938-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compare shipped v0.9.19 and v0.9.38 playback backends
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT=3682d8b28266350354b2636b4ab19de7f8511cfb
          git fetch --depth=1 origin "$OLD_COMMIT"
          git show "$OLD_COMMIT:EpiMediaHub_v0.9.19.ipk" > /tmp/EpiMediaHub_v0.9.19.ipk
          inspect_ipk() {
            local version="$1" ipk="$2" base="/tmp/audio-$1"
            rm -rf "$base"; mkdir -p "$base/ar" "$base/data"
            (cd "$base/ar" && ar x "$ipk")
            tar -xzf "$base/ar/data.tar.gz" -C "$base/data"
            local p="$base/data/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub/plugin.py"
            python3 - "$version" "$p" <<'PY'
          import re,sys
          from pathlib import Path
          version,p=sys.argv[1],Path(sys.argv[2])
          t=p.read_text(encoding='utf-8')
          print('\n===== VERSION %s =====' % version)
          print('lines',len(t.splitlines()))
          for st in (1,4097,5001,5002):
              print('service_type_%s=%d' % (st,len(re.findall(r'eServiceReference\(\s*%d\s*,' % st,t))))
          print('playService=',t.count('playService('),'stopService=',t.count('stopService('))
          print('eDVBVolumecontrol=',t.count('eDVBVolumecontrol'),'volumeUnMute=',t.count('volumeUnMute'),'volumeMute=',t.count('volumeMute'))
          for needle in ('def _startIntroAudio','def _stopIntroAudio','class EpiMoviePlayer','class EpiLivePlayer','class EpiMediathekPlayer'):
              pos=t.find(needle)
              print('%s -> %s' % (needle,pos))
          # Print every literal service-ref construction so backend changes are obvious.
          for i,line in enumerate(t.splitlines(),1):
              if 'eServiceReference(' in line and any(x in line for x in ('4097','5001','5002')):
                  print('%05d %s' % (i,line.strip()))
          PY
          }
          inspect_ipk 0.9.19 /tmp/EpiMediaHub_v0.9.19.ipk
          inspect_ipk 0.9.38 "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.38.ipk"
