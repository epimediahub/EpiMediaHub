name: Validate Raspberry season automation and online candidates

on:
  workflow_dispatch:
  push:
    branches: [raspberry-v0.8.2-analysis-automation]
    paths:
      - 'server/epimediahub_provisioning/skip_analysis*.py'
      - 'server/epimediahub_provisioning/skip_markers.py'
      - 'server/epimediahub_provisioning/skip_automation.py'
      - 'server/epimediahub_provisioning/templates/skip_markers.html'
      - 'server/epimediahub_provisioning/deploy/install_skip_automation.sh'
      - 'server/epimediahub_provisioning/deploy/diagnose_skip_analysis.py'
      - 'server/epimediahub_provisioning/tests/test_skip_markers.py'
      - 'server/epimediahub_provisioning/deploy/fix_skip_analysis_boundaries.sh'
      - 'server/epimediahub_provisioning/tests/test_skip_analysis*.py'
      - 'server/epimediahub_provisioning/tests/test_skip_installer*.py'
      - 'server/epimediahub_provisioning/deploy/inspect_skip_references.py'
      - '.github/workflows/raspberry-v082-reference-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and audio dependencies
        run: |
          python -m pip install -r server/epimediahub_provisioning/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint1
      - name: Check Python syntax
        run: python -m compileall -q server/epimediahub_provisioning
      - name: Verify existing dashboard and device behavior
        env:
          EPIMEDIAHUB_EXPECTED_API_VERSION: '0.8.2'
        run: python server/epimediahub_provisioning/tests/smoke_v080.py
      - name: Verify marker API and real audio matching
        run: python server/epimediahub_provisioning/tests/smoke_v082.py
      - name: Verify automatic publishing, online data, reference caching and provider safeguards
        run: python -m unittest discover -s server/epimediahub_provisioning/tests -p 'test_skip_analysis*.py' -v
      - name: Check Raspberry installer syntax
        run: |
          if [ -f server/epimediahub_provisioning/deploy/fix_skip_analysis_boundaries.sh ]; then
            bash -n server/epimediahub_provisioning/deploy/fix_skip_analysis_boundaries.sh
          fi
          if [ -f server/epimediahub_provisioning/deploy/install_skip_automation.sh ]; then
            bash -n server/epimediahub_provisioning/deploy/install_skip_automation.sh
          fi
      - name: Verify installer success, preflight, active worker and rollback
        run: python -m unittest discover -s server/epimediahub_provisioning/tests -p 'test_skip_installer*.py' -v
      - name: Inspect public timing database availability
        run: |
          PYTHONPATH=server/epimediahub_provisioning python - <<'PY'
          from skip_automation import fetch_json, parse_online
          try:
              data = fetch_json('https://api.theintrodb.org/v3/media?tmdb_id=8358&season=2&episode=13&duration_ms=2619053')
              segments = parse_online(data,2619053)
              print('LIVE_DATABASE_LOOKUP=' + ('segments_available' if segments else 'no_segments'))
              print('LIVE_DATABASE_RESPONSE_FIELDS=' + ','.join(sorted(data)))
              print('LIVE_DATABASE_SEGMENTS=' + str(segments))
          except (ValueError,OSError,TypeError):
              print('LIVE_DATABASE_LOOKUP=unavailable_from_ci')
          PY
