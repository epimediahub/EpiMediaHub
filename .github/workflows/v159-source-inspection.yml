name: v160 Original intro and startup source inspection
on:
  push:
    branches: [feature/v160-cinematic-launch-intro]
    paths:
      - '.github/workflows/v159-source-inspection.yml'
  workflow_dispatch:
  pull_request:
    branches: [release/v157-unified-playback-recent]
    paths:
      - '.github/workflows/v159-source-inspection.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct patched Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* | base64 -d > .ci-android/source.tar.gz
          test "$(sha256sum .ci-android/source.tar.gz | cut -d' ' -f1)" = "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Run existing source patches
        shell: bash
        env:
          EPIMEDIAHUB_OFFICIAL_CANDIDATE: '1'
        run: |
          set -euo pipefail
          bash build_tools/install_android_v1033_source.sh
          python3 android/v1.0.34-vpn/patch_wireguard_spike.py
          python3 android/v1.0.34-vpn/patch_playlist_routing.py
          for v in 149 150 151 152 153 154 155 156 157 158; do
            python3 "android/v1.0.$((10#$v - 100))/patch_v$v.py"
          done
          python3 android/v1.0.59/patch_v159.py
          python3 -m py_compile android/v1.0.59/patch_v159.py
      - name: Print full intro, startup and caching implementation
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          r=Path(os.environ['PROJECT_ROOT'])/'app/src/main/java/de/epimediahub/app'
          files=['EpiMediaHubApp.kt','MainViewModel.kt','data/PrefsRepository.kt','data/XtreamClient.kt']
          files += [str(x.relative_to(r)) for x in r.rglob('*.kt') if 'V070IntroScreen' in x.read_text(errors='ignore')]
          for name in sorted(set(files)):
              p=r/name
              print('### FILE',name)
              lines=p.read_text().splitlines()
              if name.endswith('Intro.kt') or 'V070IntroScreen' in p.read_text() and name!='EpiMediaHubApp.kt':
                  for i,x in enumerate(lines): print(f'{i+1:04d}: {x}')
                  continue
              pattern={'EpiMediaHubApp.kt':r'showIntro|V070IntroScreen|rememberSaveable|LaunchedEffect|refreshPlaylistsAtAppStart|Lifecycle.Event.ON_START|dashboardPaired|v120LicenseState', 'MainViewModel.kt':r'fun refreshProfiles|fun refreshPlaylistsAtAppStart|fun loadCategories|fun loadItems|fun xtreamLibrary|m3uCache|xtreamLibraryCache|V128TimedCache|data class.*Ui|private val prefs|fun play\(', 'data/PrefsRepository.kt':r'fun active|fun loadPlaylists|fun selected|fun loadHistory|playlist', 'data/XtreamClient.kt':r'fun entries\(|fun categories\(|fun stream|fun details\('}[name]
              idx=[i for i,x in enumerate(lines) if re.search(pattern,x)]
              ranges=[]
              for i in idx:
                  a=max(0,i-18);b=min(len(lines),i+40)
                  if ranges and a<=ranges[-1][1]: ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
                  else: ranges.append((a,b))
              for a,b in ranges:
                  print('---',a+1,b)
                  for i in range(a,b):print(f'{i+1:04d}: {lines[i]}')
          PY
