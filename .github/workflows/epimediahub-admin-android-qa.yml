name: Private EpiMediaHub Admin Android QA
on:
  pull_request:
    paths:
      - "android/admin-app/**"
      - ".github/workflows/epimediahub-admin-android-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile separate private Android Admin app
        working-directory: android/admin-app
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload private QA build (not official distribution)
        uses: actions/upload-artifact@v4
        with:
          name: epimediahub-admin-qa-debug-unsigned-release-not-ready
          path: android/admin-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
