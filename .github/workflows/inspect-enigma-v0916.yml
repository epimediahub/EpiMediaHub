name: Inspect Enigma v0.9.16 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-enigma-v0916.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract plugin source and tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/inspect0916
          mkdir -p /tmp/inspect0916/data "$GITHUB_WORKSPACE/inspection"
          cd /tmp/inspect0916
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.16.ipk"
          tar -xzf data.tar.gz -C data
          ROOT=data/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub
          cp "$ROOT/plugin.py" "$GITHUB_WORKSPACE/inspection/plugin_v0916.py"
          find "$ROOT" -maxdepth 4 -type f | sed "s#^$ROOT/##" | sort > "$GITHUB_WORKSPACE/inspection/v0916-tree.txt"
          find "$ROOT" -type f -name '*.png' | sed "s#^$ROOT/##" | sort > "$GITHUB_WORKSPACE/inspection/v0916-pngs.txt"
          grep -nE '^(class |    def )|MessageBox|ActionMap|self\["logo"\]|theme|skin|zap|banner|infobar|InfoBar|channel|cancel|close\(' "$ROOT/plugin.py" > "$GITHUB_WORKSPACE/inspection/v0916-symbols.txt" || true

      - name: Publish inspection files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection/plugin_v0916.py inspection/v0916-tree.txt inspection/v0916-pngs.txt inspection/v0916-symbols.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect v0.9.16 UI symbols'
          git push
