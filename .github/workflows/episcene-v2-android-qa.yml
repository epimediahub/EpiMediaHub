name: EpiScene v2 Android compile and test (no release)
on:
  push:
    branches: [qa/episcene-v2-android]
    paths: ['.github/workflows/episcene-v2-android-qa.yml']
permissions:
  contents: read
  actions: read
jobs:
  compile-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4eb73efd17b28fecbb824875137e43cede07c27f
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-v164-overlay
      - name: Overlay the Android patches and launch assets
        run: |
          cp -a .ci-v164-overlay/android/v1.0.61 android/v1.0.61
          cp -a .ci-v164-overlay/android/v1.0.62 android/v1.0.62
          cp -a .ci-v164-overlay/android/v1.0.63 android/v1.0.63
          cp -a .ci-v164-overlay/android/v1.0.64 android/v1.0.64
          cp -a .ci-v164-overlay/android/v1.0.65 android/v1.0.65
          cp -a .ci-v164-overlay/android/v1.0.66 android/v1.0.66
          cp -a .ci-v164-overlay/android/v1.0.67 android/v1.0.67
          cp -a .ci-v164-overlay/android/v1.0.68 android/v1.0.68
          cp -a .ci-v164-overlay/android/v1.0.69 android/v1.0.69
          cp -a .ci-v164-overlay/android/v1.0.70 android/v1.0.70
          cp -a .ci-v164-overlay/android/v1.0.71 android/v1.0.71
          cp -a .ci-v164-overlay/android/v1.0.72 android/v1.0.72
          cp -a .ci-v164-overlay/android/v1.0.73 android/v1.0.73
          cp -a .ci-v164-overlay/android/v1.0.74 android/v1.0.74
          cp -a .ci-v164-overlay/android/v1.0.75 android/v1.0.75
          cp -a .ci-v164-overlay/android/v1.0.76 android/v1.0.76
          cp -a .ci-v164-overlay/android/v1.0.78 android/v1.0.78
          cp -a .ci-v164-overlay/android/v1.0.79 android/v1.0.79
          cp -a .ci-v164-overlay/android/v1.0.80 android/v1.0.80
          cp -a .ci-v164-overlay/android/v1.0.81 android/v1.0.81
          cp -a .ci-v164-overlay/android/v1.0.82 android/v1.0.82
          cp -a .ci-v164-overlay/android/v1.0.83 android/v1.0.83
          cp -a .ci-v164-overlay/android/v1.0.84 android/v1.0.84
          cp -a .ci-v164-overlay/android/v1.0.85 android/v1.0.85
          cp -a .ci-v164-overlay/android/v1.0.86 android/v1.0.86
          cp -a .ci-v164-overlay/android/v1.0.87 android/v1.0.87
          cp -a .ci-v164-overlay/android/v1.0.88 android/v1.0.88
          cp -a .ci-v164-overlay/android/v1.0.91 android/v1.0.91
          cp -a .ci-v164-overlay/android/v1.0.92 android/v1.0.92
          cp -a .ci-v164-overlay/android/v1.0.93 android/v1.0.93
          cp -a .ci-v164-overlay/android/v1.0.94 android/v1.0.94
          cp .ci-v164-overlay/build_tools/prepare_intro_v178.py build_tools/
          cp .ci-v164-overlay/build_tools/test_prepare_intro_v178.py build_tools/
          cp .ci-v164-overlay/build_tools/render_intro_synced.py build_tools/
          cp .ci-v164-overlay/build_tools/prepare_intro_synced.py build_tools/
          cp .ci-v164-overlay/build_tools/render_intro_orchestral_preview.py build_tools/
          cp .ci-v164-overlay/build_tools/prepare_intro_orchestral.py build_tools/
          cp .ci-v164-overlay/build_tools/prepare_intro_v176.py build_tools/
          cp .ci-v164-overlay/build_tools/render_intro_v180.py build_tools/
      - name: Prepare assets required by the earlier Android patches
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1
          command -v ffmpeg >/dev/null || { sudo apt-get update; sudo apt-get install -y ffmpeg; }
          python3 build_tools/prepare_intro_orchestral.py
          python3 build_tools/prepare_intro_synced.py
          python3 build_tools/prepare_intro_v176.py
          python3 -m unittest discover -s build_tools -p test_prepare_intro_v178.py -v
          python3 build_tools/prepare_intro_v178.py
          python3 build_tools/render_intro_v180.py
          python3 android/v1.0.85/render_intro_v185.py
      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* | base64 -d > .ci-android/source.tar.gz
          test "$(sha256sum .ci-android/source.tar.gz | awk '{print $1}')" = "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Pin Android toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF
      - name: Apply v149 through v163 patches
        shell: bash
        run: |
          set -euo pipefail
          bash build_tools/install_android_v1033_source.sh
          python3 android/v1.0.34-vpn/patch_wireguard_spike.py
          python3 android/v1.0.34-vpn/patch_playlist_routing.py
          for v in 149 150 151 152 153 154 155 156 157 158 159 160 161 162 163; do
            python3 "android/v1.0.$((10#$v - 100))/patch_v$v.py"
          done
      - name: Apply the playback patches and install the 1.0.94 intro
        run: |
          python3 android/v1.0.64/patch_v164.py
          python3 android/v1.0.65/patch_v165.py
          python3 android/v1.0.66/patch_v166.py
          python3 android/v1.0.67/patch_v167.py
          python3 android/v1.0.68/patch_v168.py
          python3 android/v1.0.69/patch_v169.py
          python3 android/v1.0.70/patch_v170.py
          python3 android/v1.0.71/patch_v171.py
          python3 android/v1.0.72/patch_v172.py
          python3 android/v1.0.73/patch_v173.py
          python3 android/v1.0.74/patch_v174.py
          python3 android/v1.0.75/patch_v175.py
          python3 android/v1.0.76/patch_v176.py
          python3 android/v1.0.78/patch_v178.py
          python3 android/v1.0.79/patch_v179.py
          python3 android/v1.0.80/patch_v180.py
          python3 android/v1.0.81/patch_v181.py
          python3 android/v1.0.82/patch_v182.py
          python3 android/v1.0.83/patch_v183.py
          python3 android/v1.0.84/patch_v184.py
          python3 android/v1.0.85/patch_v185.py
          python3 android/v1.0.86/patch_v186.py
          python3 android/v1.0.87/patch_v187.py
          python3 android/v1.0.88/patch_v188.py
          python3 android/v1.0.91/patch_v191.py
          python3 android/v1.0.92/patch_v192.py
          python3 android/v1.0.93/patch_v193.py
          python3 android/v1.0.94/patch_v194.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore Android audio native cache
        id: audio-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.PROJECT_ROOT }}/ffmpeg-audio/src/main/jni/ffmpeg/android-libs
            ${{ env.PROJECT_ROOT }}/ffmpeg-6.1.6.tar.xz
          key: audio-ffmpeg-6.1.6-ndk26b-api25-${{ runner.os }}-${{ hashFiles('build_tools/build_android_audio_v123.sh', 'android/v1.0.23/upstream.json') }}
      - name: Download pinned FFmpeg source with retries and checksum verification
        shell: bash
        run: |
          set -euo pipefail
          archive="$PROJECT_ROOT/ffmpeg-6.1.6.tar.xz"
          checksum="d4fcb164028dd3beee5d92c0ac72e46aac6973c75ea12dc14de07bf8f407370a"
          if test -s "$archive" && printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check; then
            echo "Verified FFmpeg source already cached."
          else
            rm -f "$archive" "$archive.part"
            ok=0
            for attempt in 1 2 3; do
              echo "Downloading checksum-pinned FFmpeg source (attempt $attempt/3)"
              if curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
                  --connect-timeout 20 --max-time 300 --user-agent EpiMediaHub-Builder/1.0.23 \
                  https://ffmpeg.org/releases/ffmpeg-6.1.6.tar.xz --output "$archive.part" &&
                 printf '%s  %s\n' "$checksum" "$archive.part" | sha256sum --check; then
                mv "$archive.part" "$archive"
                ok=1
                break
              fi
              rm -f "$archive.part"
              sleep 4
            done
            test "$ok" -eq 1
          fi
      - name: Prepare audio-only Android native dependencies
        run: bash build_tools/build_android_audio_v123.sh
      - name: Apply authenticated playback-start signal to both VOD players
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["PROJECT_ROOT"])/"app/src/main/java/de/epimediahub/app"
          def find(n):
              paths=list(root.rglob(n))
              assert len(paths)==1, n
              return paths[0]
          def replace(s,a,b):
              assert s.count(a)==1, a
              return s.replace(a,b,1)
          repo,player,vlc=map(find,("V116SkipRepository.kt","V116VodPlayer.kt","V168VlcVodPlayer.kt"))
          a,b,c=[p.read_text() for p in (repo,player,vlc)]
          package=next(line.split()[1] for line in a.splitlines() if line.startswith("package "))
          vlc_package=next(line.split()[1] for line in c.splitlines() if line.startswith("package "))
          import_line=f"import {package}.V116SkipRepository"
          if package != vlc_package and import_line not in c.splitlines():
              c=replace(c,f"package {vlc_package}\n",f"package {vlc_package}\n\n{import_line}\n")
          load='val remote = request("${SetupCodeProvisioning.provisioningBaseUrl(context)}/v1/device/skip/lookup", payload(item, duration), true)'
          a=replace(a,load,load.replace('payload(item, duration), true)', 'payload(item, duration).put("playback_started", false), true)'))
          anchor='    suspend fun load(item: MediaEntry, duration: Long): V116SkipResult = supervisorScope {'
          method='''    suspend fun notifyPlaybackStarted(item: MediaEntry, duration: Long): Boolean {
                  if (item.kind != MediaKind.EPISODE || duration <= 0 || playlistId(item) <= 0) return false
                  return request("${SetupCodeProvisioning.provisioningBaseUrl(context)}/v1/device/skip/lookup",
                      payload(item, duration).put("playback_started", true), true) != null
              }

          '''
          a=replace(a,anchor,method+anchor)
          anchor='    LaunchedEffect(item.resumeKey, state.durationMs / 1000, refresh) {'
          assert 'playing = player.isPlaying' in b
          b=replace(b,anchor,'''    var playbackNotified by remember(item.resumeKey) { mutableStateOf(false) }
              LaunchedEffect(item.resumeKey, state.playing, state.durationMs > 0) {
                  if (!playbackNotified && state.playing && state.durationMs > 0) {
                      playbackNotified = repository.notifyPlaybackStarted(item, state.durationMs)
                  }
              }
          '''+anchor)
          anchor='    LaunchedEffect(item.resumeKey) { runCatching { focus.requestFocus() } }'
          assert 'isPlaying = player.isPlaying' in c
          c=replace(c,anchor,'''    val skipRepository = remember(context.applicationContext) { V116SkipRepository(context) }
              var playbackNotified by remember(item.resumeKey) { mutableStateOf(false) }
              LaunchedEffect(item.resumeKey, isPlaying, duration > 0L) {
                  if (!playbackNotified && isPlaying && duration > 0L) {
                      playbackNotified = skipRepository.notifyPlaybackStarted(item, duration)
                  }
              }
          '''+anchor)
          for p,s in zip((repo,player,vlc),(a,b,c)): p.write_text(s)
          PY
      - name: Compile and run unit tests without signing or publishing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.workers.max=2
