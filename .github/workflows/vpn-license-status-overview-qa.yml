name: VPN license and connection status read-only dashboard QA
on:
  push:
    branches: [feature/vpn-license-status-overview-20261015]
    paths:
      - '.github/workflows/vpn-license-status-overview-qa.yml'
      - 'server/epimediahub_provisioning/vpn_license_overview.py'
      - 'server/epimediahub_provisioning/templates/dashboard_v080.html'
      - 'server/epimediahub_provisioning/static/beta-admin.css'
      - 'server/epimediahub_provisioning/deploy/install_control_center_beta.py'
      - 'server/epimediahub_provisioning/tests/test_vpn_dashboard.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install server test dependencies
        run: pip install -r server/epimediahub_provisioning/requirements.txt
      - name: Compile and validate change safety
        run: |
          python -m py_compile \
            server/epimediahub_provisioning/vpn_license_overview.py \
            server/epimediahub_provisioning/deploy/install_control_center_beta.py
          python - <<'PY'
          from pathlib import Path
          base=Path('server/epimediahub_provisioning')
          installer=(base/'deploy/install_control_center_beta.py').read_text()
          html=(base/'templates/dashboard_v080.html').read_text()
          assert 'vpn_license_overview.py' in installer
          assert 'import vpn_license_overview' in installer
          assert 'vpn_annual_authorizations' in installer
          assert 'vpn-license-overview' in html
          assert html.count('VERBINDUNG / HANDSHAKE') == 1
          assert html.count('ABLAUFDATUM') == 1
          assert '/admin/vpn/year365/{{ device.id }}' in html
          assert '/admin/vpn/trial7-auto/{{ device.id }}' in html
          PY
      - name: VPN license and full VPN dashboard regression
        run: python -m unittest discover -s server/epimediahub_provisioning/tests -p 'test_vpn_dashboard.py' -v
