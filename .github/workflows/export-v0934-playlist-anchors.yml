name: Export v0.9.34 Playlist Anchors

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-v0934-playlist-anchors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export compact anchors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/epiexport && mkdir -p /tmp/epiexport/ar /tmp/epiexport/data
          cd /tmp/epiexport/ar
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.34.ipk"
          tar -xzf data.tar.gz -C ../data
          P=/tmp/epiexport/data/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub/plugin.py
          export P
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY' > v0934_playlist_anchors.txt
          import os,re
          from pathlib import Path
          lines=Path(os.environ['P']).read_text(encoding='utf-8').splitlines()
          def emit(a,b,title):
              print('\n### '+title+' [%d-%d]'%(a+1,b))
              for i in range(a,min(b,len(lines))): print('%05d %s'%(i+1,lines[i]))
          emit(0,min(130,len(lines)),'IMPORTS')
          patterns=[
              ('CONSTANTS',r'PLAYLIST_DIR|DEFAULT_PLAYLIST|PLAYLIST_URL_FILE|M3U_URL_DEFAULT'),
              ('HELPERS',r'^def (ensure_config_dir|load_playlist_url|load_playlist_url2|download_playlist|save_settings|load_settings)\b'),
              ('CLASSES',r'^class .*?(Playlist|Settings)'),
              ('SWITCH',r'def .*playlist|switchPlaylist|switch_playlist|active_playlist'),
              ('NO_PLAYLIST',r'keine playlist|no playlist|not os\.path\.exists\(.*playlist|DEFAULT_PLAYLIST.*exists|download_playlist\('),
              ('HOME',r'^class EpiMediaHubHome\b|def keyOK\b|def openSettings\b|def .*Settings\b')
          ]
          used=[]
          for title,pat in patterns:
              rx=re.compile(pat,re.I)
              hits=[i for i,l in enumerate(lines) if rx.search(l)]
              print('\n## '+title+' HITS '+str([x+1 for x in hits[:30]]))
              for k,i in enumerate(hits[:12]):
                  a=max(0,i-18); b=min(len(lines),i+80)
                  if any(a>=x and b<=y for x,y in used): continue
                  used.append((a,b)); emit(a,b,title+'#'+str(k+1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v0934_playlist_anchors.txt
          git commit -m 'Export v0.9.34 playlist anchors'
          git push
