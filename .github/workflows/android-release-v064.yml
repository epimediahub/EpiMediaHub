name: Build signed EpiMediaHub Android v0.6.4 test

on:
  workflow_dispatch:
  push:
    branches: [android-v0.6.0-cinematic-ui]
    paths:
      - '.github/workflows/android-release-v064.yml'
      - 'android/v0.6.4/**'
      - 'build_tools/install_android_v064_source.sh'

concurrency:
  group: epimediahub-android-v064-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-v064:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      TAILSCALE_ANDROID_SHA: c412dfe3b28ed7c5dd4de233149fa1bd55065dfd
    steps:
      - uses: actions/checkout@v4

      - name: Require permanent signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          echo "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c  .ci-android/source.tar.gz" | sha256sum -c -
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Pin Gradle toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF

      - name: Install v0.6.4 source
        run: bash build_tools/install_android_v064_source.sh

      - name: Import existing premium skin assets
        run: bash build_tools/import_enigma_v0941_android_assets.sh

      - name: Install permanent release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/epimediahub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias epimediahub >/dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['PROJECT_ROOT'])/'app/build.gradle.kts'
          s=p.read_text()
          anchor='    buildTypes {\n'
          signing='''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = "epimediahub"
                  keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
              }
          }

          '''
          if anchor not in s: raise SystemExit('buildTypes anchor missing')
          s=s.replace(anchor, signing+anchor, 1)
          s=s.replace('        release {\n            isMinifyEnabled = false','        release {\n            signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = false',1)
          p.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;23.1.7779620"

      - name: Restore embedded Tailscale runtime cache
        id: tailscale-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/tailscale/${{ env.TAILSCALE_ANDROID_SHA }}
          key: epimediahub-tailscale-${{ runner.os }}-${{ env.TAILSCALE_ANDROID_SHA }}-ndk23.1-v1

      - name: Install cached Tailscale runtime
        if: steps.tailscale-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR=".ci-cache/tailscale/$TAILSCALE_ANDROID_SHA"
          mkdir -p "$PROJECT_ROOT/app/libs"
          cp "$CACHE_DIR/tailscale-embedded.aar" "$PROJECT_ROOT/app/libs/tailscale-embedded.aar"
          cp "$CACHE_DIR/libtailscale.aar" "$PROJECT_ROOT/app/libs/libtailscale.aar"
          test -s "$PROJECT_ROOT/app/libs/tailscale-embedded.aar"
          test -s "$PROJECT_ROOT/app/libs/libtailscale.aar"
          echo "Using cached embedded Tailscale runtime $TAILSCALE_ANDROID_SHA"

      - name: Build embedded official Tailscale runtime
        if: steps.tailscale-cache.outputs.cache-hit != 'true'
        run: bash build_tools/build_tailscale_embedded.sh

      - name: Stage embedded Tailscale runtime for cache
        if: steps.tailscale-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR=".ci-cache/tailscale/$TAILSCALE_ANDROID_SHA"
          mkdir -p "$CACHE_DIR"
          cp "$PROJECT_ROOT/app/libs/tailscale-embedded.aar" "$CACHE_DIR/tailscale-embedded.aar"
          cp "$PROJECT_ROOT/app/libs/libtailscale.aar" "$CACHE_DIR/libtailscale.aar"
          test -s "$CACHE_DIR/tailscale-embedded.aar"
          test -s "$CACHE_DIR/libtailscale.aar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed v0.6.4 test APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify v0.6.4 fixes and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionName = "0.6.4"' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'versionCode = 604' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'sourceProfileId' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/model/Models.kt"
          grep -Fq 'streamServerCache' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/XtreamClient.kt"
          grep -Fq 'server_info' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/XtreamClient.kt"
          grep -Fq 'direct_source' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/XtreamClient.kt"
          grep -Fq 'listOf(cachedStreamServer(), p.server.trimEnd' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/XtreamClient.kt"
          grep -Fq 'useController = item.kind != MediaKind.LIVE' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'if (item.kind == MediaKind.LIVE && controls)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'EpiMediaHub beenden?' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/EpiMediaHubApp.kt"
          APK="$PROJECT_ROOT/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          CERT="$(grep -i 'certificate SHA-256 digest:' /tmp/apk-signature.txt | head -n1 | awk -F': ' '{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "7939E7DDCBABA56F03D5FB0833D8A580B7797C12C4CCE378CA086C46F1B36D8E"

      - name: Prepare test files
        shell: bash
        run: |
          mkdir -p dist
          cp "$PROJECT_ROOT/app/build/outputs/apk/release/app-release.apk" dist/EpiMediaHub_Android_v0.6.4-test.apk
          sha256sum dist/EpiMediaHub_Android_v0.6.4-test.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub-Android-v0.6.4-signed-test
          path: |
            dist/EpiMediaHub_Android_v0.6.4-test.apk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish public GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.6.4-test"
          TITLE="EpiMediaHub Android v0.6.4 Test"
          NOTES="Testversion mit robuster Xtream-Wiedergabe: direct_source wird bevorzugt, der tatsächliche Streaming-Host/Port wird aus server_info übernommen und die Portal-Adresse bleibt mit ts/m3u8/extensionless Varianten als Fallback erhalten. Enthält weiterhin die Playlist-Isolation und das Live-TV-Senderbanner aus v0.6.3. Der Tailscale-Runtime-Build wird für Folge-Builds gecacht."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/EpiMediaHub_Android_v0.6.4-test.apk \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              dist/EpiMediaHub_Android_v0.6.4-test.apk \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
