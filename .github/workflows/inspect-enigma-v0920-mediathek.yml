name: Inspect Enigma v0.9.20 Mediathek hooks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-enigma-v0920-mediathek.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract current plugin source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/inspect0920
          mkdir -p /tmp/inspect0920/ar /tmp/inspect0920/data inspection
          cd /tmp/inspect0920/ar
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.20.ipk"
          tar -xzf data.tar.gz -C ../data
          ROOT=/tmp/inspect0920/data/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub
          cp "$ROOT/plugin.py" "$GITHUB_WORKSPACE/inspection/plugin_v0920.py"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/inspect0920/data/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub/plugin.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          keys=('class EpiHome','HOME_SKIN','home_search','openSearch','Search','class EpiMoviePlayer','eServiceReference','openWithCallback','VirtualKeyBoard')
          out=[]; seen=[]
          for i,line in enumerate(lines,1):
              if any(k.lower() in line.lower() for k in keys):
                  a=max(1,i-35); b=min(len(lines),i+80)
                  if any(a>=x and b<=y for x,y in seen):
                      continue
                  seen.append((a,b)); out.append('\n===== lines %d-%d =====\n' % (a,b))
                  for n in range(a,b+1): out.append('%05d: %s\n' % (n,lines[n-1]))
          Path('/home/runner/work/EpiMediaHub/EpiMediaHub/inspection/v0920-mediathek-hooks.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Publish inspection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection/plugin_v0920.py inspection/v0920-mediathek-hooks.txt
          git commit -m 'Inspect v0.9.20 mediathek hooks'
          git push
