name: Publish Enigma v0.9.40 Update Install Fix

on:
  push:
    paths:
      - 'build_tools/build_v0940_update_install_fix.sh'
      - '.github/workflows/publish-enigma-v0940-update-install-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish v0.9.40
        shell: bash
        run: bash build_tools/build_v0940_update_install_fix.sh
