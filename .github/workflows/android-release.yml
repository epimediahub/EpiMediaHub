name: Release signed EpiMediaHub Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/release-trigger.txt'

concurrency:
  group: epimediahub-android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require permanent signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_B64 secret is missing" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD secret is missing" && exit 1)

      - name: Reconstruct Gradle project shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          echo "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c  .ci-android/source.tar.gz" | sha256sum -c -
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Pin Android Gradle and Kotlin toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF

      - name: Install Android v0.3.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_ROOT/app/src/main/java"
          rm -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          cp -a android/v0.3.0/app/. "$PROJECT_ROOT/app/"
          cp -a android/v0.3.1/app/. "$PROJECT_ROOT/app/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['PROJECT_ROOT'])
          p = root / 'app/src/main/java/de/epimediahub/app/ui/Screens.kt'
          s = p.read_text()
          s = s.replace('onClick={if(kind==MediaKind.SERIES){{vm.navigate(Screen.Episodes(m))}}else{{vm.play(m)}}}', 'onClick={if(kind==MediaKind.SERIES) vm.navigate(Screen.Episodes(m)) else vm.play(m)}')
          s = s.replace('onClick={if(m.kind==MediaKind.SERIES){{vm.navigate(Screen.Episodes(m))}}else{{vm.play(m)}}}', 'onClick={if(m.kind==MediaKind.SERIES) vm.navigate(Screen.Episodes(m)) else vm.play(m)}')
          s = s.replace('LinearProgressIndicator({it},Modifier.fillMaxWidth().padding(top=6.dp))', 'LinearProgressIndicator(progress={it},modifier=Modifier.fillMaxWidth().padding(top=6.dp))')
          s = s.replace('Android v0.3.0', 'Android v0.3.1')
          s = s.replace('Modernisierte Oberfläche · Xtream-Eingabe · lokale Browser-Verwaltung', 'Rundere Oberfläche · sichere Zurück-Navigation · Xtream · PC-Verwaltung · 24h-Updateprüfung')
          p.write_text(s)
          PY

      - name: Import 59 themes and EpiMediaHub artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android/ipk
          cd .ci-android/ipk
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.7.ipk"
          tar -xzf data.tar.gz
          PLUGIN="$PWD/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub"
          APP="$GITHUB_WORKSPACE/$PROJECT_ROOT/app/src/main"
          DRAW="$APP/res/drawable-nodpi"
          mkdir -p "$DRAW" "$APP/res/raw"
          for file in "$PLUGIN"/themes/*.png; do name="$(basename "$file")"; cp "$file" "$DRAW/theme_$name"; done
          for file in "$PLUGIN"/themes/marks/*.png; do name="$(basename "$file")"; cp "$file" "$DRAW/mark_$name"; done
          cp "$PLUGIN/themes/catalog.json" "$APP/res/raw/theme_catalog.json"
          cp "$PLUGIN/header.png" "$DRAW/brand_header.png"
          cp "$PLUGIN/header.png" "$DRAW/tv_banner.png"
          cp "$PLUGIN/plugin.png" "$DRAW/app_icon.png"
          cp "$PLUGIN/splash.png" "$DRAW/splash.png"
          cp "$PLUGIN/home_live.png" "$DRAW/icon_live.png"
          cp "$PLUGIN/home_movies.png" "$DRAW/icon_movies.png"
          cp "$PLUGIN/home_series.png" "$DRAW/icon_series.png"
          cp "$PLUGIN/home_search.png" "$DRAW/icon_search.png"
          cp "$PLUGIN/home_settings.png" "$DRAW/icon_settings.png"
          cp "$PLUGIN/home_playlist.png" "$DRAW/icon_playlist.png"
          test "$(find "$DRAW" -maxdepth 1 -type f -name 'theme_*.png' | wc -l)" -eq 59
          test "$(find "$DRAW" -maxdepth 1 -type f -name 'mark_*.png' | wc -l)" -eq 59

      - name: Install permanent release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/epimediahub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias epimediahub >/dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PROJECT_ROOT']) / 'app/build.gradle.kts'
          s = p.read_text()
          anchor = '    buildTypes {\n'
          signing = '''    signingConfigs {\n        create("release") {\n            storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))\n            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias = "epimediahub"\n            keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n        }\n    }\n\n'''
          if anchor not in s:
              raise SystemExit('buildTypes anchor missing')
          s = s.replace(anchor, signing + anchor, 1)
          s = s.replace('        release {\n            isMinifyEnabled = false', '        release {\n            signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = false', 1)
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify permanent signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          CERT="$(grep -i 'certificate SHA-256 digest:' /tmp/apk-signature.txt | head -n1 | awk -F': ' '{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "7939E7DDCBABA56F03D5FB0833D8A580B7797C12C4CCE378CA086C46F1B36D8E"

      - name: Prepare signed release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PROJECT_ROOT/app/build/outputs/apk/release/app-release.apk" dist/EpiMediaHub-Android.apk
          cp dist/EpiMediaHub-Android.apk dist/EpiMediaHub_Android_v0.3.1-release.apk
          sha256sum dist/EpiMediaHub-Android.apk | tee dist/SHA256SUMS.txt

      - name: Upload signed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub-Android-v0.3.1-signed
          path: |
            dist/EpiMediaHub_Android_v0.3.1-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable Downloader APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-latest"
          ASSET="dist/EpiMediaHub-Android.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "EpiMediaHub Android v0.3.1" --notes "First permanently signed Android baseline. Central Android/Google-TV back navigation and automatic 24-hour in-app update checks with SHA-256 verified download."
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "EpiMediaHub Android v0.3.1" --notes "First permanently signed Android baseline. Central Android/Google-TV back navigation and automatic 24-hour in-app update checks with SHA-256 verified download."
          fi

      - name: Publish matching update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum dist/EpiMediaHub-Android.apk | awk '{print $1}')"
          python3 - "$SHA" <<'PY'
          import json, sys
          from pathlib import Path
          data = {
              "version": "0.3.1",
              "versionCode": 31,
              "url": "https://github.com/epimediahub/EpiMediaHub/releases/download/android-latest/EpiMediaHub-Android.apk",
              "sha256": sys.argv[1],
              "notes": "Neue zentrale Zurück-Navigation: auf Unterseiten führt BACK genau eine EpiMediaHub-Seite zurück. Automatische Updateprüfung alle 24 Stunden; neue APKs werden in der App angeboten, heruntergeladen, per SHA-256 geprüft und anschließend an den Android-Paketinstaller übergeben."
          }
          Path('/tmp/update.json').write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          FILE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/android/update.json?ref=main" --jq .sha)"
          CONTENT="$(base64 -w0 /tmp/update.json)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/android/update.json" \
            -f message="Update Android updater manifest to signed v0.3.1" \
            -f content="$CONTENT" \
            -f sha="$FILE_SHA" \
            -f branch="main" >/dev/null

      - name: Show stable Downloader URL
        run: echo "https://github.com/epimediahub/EpiMediaHub/releases/download/android-latest/EpiMediaHub-Android.apk"
