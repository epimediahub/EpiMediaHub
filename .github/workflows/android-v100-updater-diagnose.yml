name: Diagnose Android v1.0.0 updater package

on:
  push:
    branches: [android-v1.0.0-dev]
    paths:
      - '.github/workflows/android-v100-updater-diagnose.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch updater manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 https://download.epimediahub.com/android/latest.json -o latest.json
          echo "=== latest.json ==="
          cat latest.json
          jq -e '.version == "1.0.0" and .versionCode == 1000' latest.json
      - name: Download and validate every updater APK
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for ABI in arm64-v8a armeabi-v7a universal; do
            URL="$(jq -r --arg abi "$ABI" '.apks[$abi].url' latest.json)"
            EXPECTED="$(jq -r --arg abi "$ABI" '.apks[$abi].sha256' latest.json | sed 's/^sha256://')"
            SIZE="$(jq -r --arg abi "$ABI" '.apks[$abi].size' latest.json)"
            FILE="$ABI.apk"
            echo "=== $ABI ==="
            echo "$URL"
            curl -fL --retry 3 --connect-timeout 15 "$URL" -o "$FILE"
            ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
            ACTUAL_SIZE="$(stat -c %s "$FILE")"
            echo "size=$ACTUAL_SIZE expected=$SIZE"
            echo "sha256=$ACTUAL"
            test "$ACTUAL" = "$EXPECTED"
            test "$ACTUAL_SIZE" = "$SIZE"
            unzip -t "$FILE" >/dev/null
            "$APKSIGNER" verify --verbose "$FILE"
            "$AAPT" dump badging "$FILE" | head -n 12
          done
