name: Inspect Android v1.0.0 generated sources

on:
  workflow_dispatch:
  push:
    branches: [android-v1.0.0-dev]
    paths:
      - '.github/workflows/android-v100-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and install v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          bash build_tools/install_android_v100_source.sh
      - name: Print Mediathek source
        shell: bash
        run: |
          echo '===== ParityScreens.kt ====='
          sed -n '1,520p' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/ParityScreens.kt"
          echo '===== MediathekClient.kt ====='
          sed -n '1,420p' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/MediathekClient.kt"
