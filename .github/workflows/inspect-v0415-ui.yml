name: Inspect Android v0.4.15 setup flow

on:
  workflow_dispatch:
  push:
    branches: [android-v0.4.16-provisioning-gate]
    paths:
      - '.github/workflows/inspect-v0415-ui.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and patch v0.4.15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          bash build_tools/install_android_v0415_source.sh
      - name: Show navigation and setup source
        shell: bash
        run: |
          set -euo pipefail
          JAVA="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app"
          for f in MainActivity.kt ui/V044Home.kt ui/Screens.kt ui/SetupCodeLogin.kt data/SetupCodeProvisioning.kt; do
            echo "===== $f ====="
            if [ -f "$JAVA/$f" ]; then
              sed -n '1,260p' "$JAVA/$f"
            else
              echo MISSING
            fi
          done
