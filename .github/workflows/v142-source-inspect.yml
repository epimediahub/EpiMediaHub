name: Inspect EpiMediaHub Android device identity and settings hooks
on:
  push:
    branches: [feature/vpn-v142-auto-provisioning]
    paths: ['.github/workflows/v142-source-inspect.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android sources
        run: |
          set -euo pipefail
          mkdir -p .inspect
          cat android/source_parts/source_* > .inspect/source.b64
          base64 -d .inspect/source.b64 > .inspect/source.tar.gz
          echo "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c  .inspect/source.tar.gz" | sha256sum -c
          tar -xzf .inspect/source.tar.gz -C .inspect
          PROJECT_ROOT="$(find .inspect -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          bash build_tools/install_android_v1033_source.sh
      - name: Inspect device session, device ID, settings and license source hooks
        run: |
          python - <<'PY'
          import os,re,pathlib
          root=pathlib.Path(os.environ['PROJECT_ROOT'])/'app/src/main/java/de/epimediahub/app'
          out=[]
          terms=re.compile(r'deviceId|device_id|sessionToken|session_token|pairingToken|api\.epimediahub|SettingsScreen|data class .*Settings|fun .*device|license/status|/v1/device/config|tokenStore|DeviceIdentity|installationId|trialKey',re.I)
          for file in sorted(root.rglob('*.kt')):
              data=file.read_text(errors='replace').splitlines()
              hits=[(n+1,s.strip()) for n,s in enumerate(data) if terms.search(s)]
              if hits:
                  out.append('\n# '+str(file.relative_to(root)))
                  out += [str(n)+': '+s[:250] for n,s in hits[:32]]
          pathlib.Path('build_status/v142-source-inspection.txt').write_text('\n'.join(out)[:40000]+'\n')
          print('Found',len(out),'source lines/files relevant to Android identity')
          PY
      - name: Persist source reference report on dev branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), {owner,repo}=context.repo;
            const path='build_status/v142-source-inspection.txt';
            const content=Buffer.from(fs.readFileSync(path));
            let sha; try { const x=await github.rest.repos.getContent({owner,repo,path,ref:'feature/vpn-v142-auto-provisioning'}); sha=x.data.sha; }catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch:'feature/vpn-v142-auto-provisioning',sha,
              message:'inspect(android): record device ID/session API code anchors',
              content:content.toString('base64')
            });
