name: Publish Enigma v0.9.25 Mediathek Lifecycle Fix

on:
  push:
    branches: [ main ]
    paths:
      - 'build_tools/build_v0925_mediathek_lifecycle.sh'
      - '.github/workflows/publish-enigma-v0925-mediathek-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.25
        run: bash build_tools/build_v0925_mediathek_lifecycle.sh
