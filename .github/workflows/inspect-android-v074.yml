name: Inspect Android v0.7.4 targets

on:
  push:
    branches: [android-v0.7.0-ui]
    paths:
      - '.github/workflows/inspect-android-v074.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          EXPECTED="192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          ACTUAL="$(sha256sum .ci-android/source.tar.gz | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Pin Gradle toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOT
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOT
      - name: Install v0.7.4 source
        run: bash build_tools/install_android_v074_source.sh
      - name: Inspect v0.7.4 target code
        shell: bash
        run: |
          set -euo pipefail
          JAVA="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app"
          echo '=== PLAYER LIVE SWITCH ==='
          grep -n -A260 -B30 'fun switchLiveBy' "$JAVA/ui/PlayerScreen.kt" || true
          echo '=== PLAYER KEY BLOCK 0.7.4 ==='
          sed -n '430,520p' "$JAVA/ui/PlayerScreen.kt" || true
          echo '=== LIVE LIBRARY / ROUTES ==='
          grep -Rni -E 'Screen\.Library|LibraryScreen|openLibrary|switchLibraryCategory|MediaKind\.LIVE|Live.*Screen|V070.*Live' "$JAVA" | head -n 500 || true
          echo '=== VM FUNCTIONS ==='
          grep -n -A90 -B20 -E 'fun openLibrary|fun switchLibraryCategory|fun switchLiveChannel|fun back\(' "$JAVA/MainViewModel.kt" || true
          echo '=== SCREEN ROUTING ==='
          grep -n -A180 -B30 -E 'Screen\.Library|V060CinematicHubScreen|LibraryScreen' "$JAVA/EpiMediaHubApp.kt" || true
          echo '=== BROWSER ROWS ==='
          sed -n '1,340p' "$JAVA/ui/BrowserRows.kt" || true
          echo '=== SCREENS LIBRARY ==='
          grep -n -A320 -B30 -E 'fun LibraryScreen|fun Category|MediaKind\.LIVE' "$JAVA/ui/Screens.kt" || true
          echo '=== MAIN VIEWMODEL FULL LIBRARY LOAD ==='
          sed -n '80,440p' "$JAVA/MainViewModel.kt" || true
          echo '=== M3U PARSER ==='
          sed -n '1,220p' "$JAVA/data/M3uParser.kt" || true
          echo '=== CINEMATIC HUB ==='
          sed -n '1,300p' "$JAVA/ui/V060CinematicHub.kt" || true
          echo '=== UPDATE MANAGER ==='
          sed -n '1,360p' "$JAVA/data/UpdateManager.kt" || true
