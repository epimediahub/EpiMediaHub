name: Publish official EpiMediaHub v1.0.71 Live Cinema and Outro focus

on:
  push:
    branches: [release/v171-official-inapp]
    paths:
      - '.github/workflows/v171-official-inapp-updater.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: epimediahub-android-rolling-updater
  cancel-in-progress: false

jobs:
  publish-tested-v171:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: epimediahub/EpiMediaHub
      BRANCH: release/v171-official-inapp
      TAG: v0.7.0-test
      QA_RUN: '38736292859'
      QA_SHA: '2f04436744fb8dfdb9b5a6cf88622b48b0501861'
      QA_ARTIFACT: EpiMediaHub-v171-private-epg-recovery-official-signed
    steps:
      - uses: actions/checkout@v4

      - name: Gate promotion on exact successful signed immutable v171 QA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPO"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          gh api "repos/$REPO/actions/runs/$QA_RUN" > verified-run.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('verified-run.json'))
          assert run['id']==int(os.environ['QA_RUN'])
          assert run['head_sha']==os.environ['QA_SHA']
          assert run['head_branch']=='fix/v171-outro-next-remote-focus'
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_repository']['full_name']==os.environ['REPO']
          PY
          gh api "repos/$REPO/actions/runs/$QA_RUN/jobs?per_page=100" > verified-jobs.json
          python3 - <<'PY'
          import json,os
          jobs=json.load(open('verified-jobs.json'))['jobs']
          jobs=[x for x in jobs if x.get('conclusion')=='success']
          assert len(jobs)==1, 'Unexpected number of successful QA jobs'
          j=jobs[0]
          assert j['run_id']==int(os.environ['QA_RUN'])
          steps={s['name']:s.get('conclusion') for s in j['steps']}
          required=[
              'Check official v1.0.66 Kotlin compilation',
              'Run complete Android unit tests',
              'Assemble official signed APKs',
              'Verify official package and signing identity',
              'Verify v171 outro remote focus, v170 cadence, VPN and existing recovery',
              'Verify exact approved intro through Android resource IDs in every signed APK',
              'Publish isolated Downloader test APK after all compile, test and signing gates'
          ]
          for name in required:
              assert steps.get(name)=='success', (name,steps.get(name))
          print('v171 signed QA, intro, VPN and focus gates all succeeded on immutable candidate.')
          PY

      - name: Recover precisely signed APKs and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa dist
          gh run download "$QA_RUN" --repo "$REPO" --name "$QA_ARTIFACT" --dir qa
          (cd qa && sha256sum --check SHA256SUMS.txt)
          for ABI in arm64-v8a armeabi-v7a universal; do
            SOURCE="qa/EpiMediaHub-Android-v1.0.71-$ABI.apk"
            TARGET="dist/EpiMediaHub_Android_v1.0.71-$ABI.apk"
            test -s "$SOURCE"
            test "$(stat -c %s "$SOURCE")" -gt 10000000
            cp "$SOURCE" "$TARGET"
          done
          cp dist/EpiMediaHub_Android_v1.0.71-universal.apk dist/EpiMediaHub_Android_v0.7.0-test.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          test "$(find qa -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3

      - name: Read official installed-update version and refuse downgrade
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" >/dev/null
          mkdir -p previous
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir previous
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          old=json.loads(Path('previous/latest.json').read_text(encoding='utf-8'))
          old_code=int(old.get('versionCode',0))
          if old_code>=1071:
              raise SystemExit(f'Official updater already at {old_code}; refusing downgrade/equal overwrite')
          if old_code<1000:
              raise SystemExit(f'Unexpected versionCode {old_code}; refusing unsafe publication')
          names={abi:f'EpiMediaHub_Android_v1.0.71-{abi}.apk'
                 for abi in ('arm64-v8a','armeabi-v7a','universal')}
          apks={}
          for abi,filename in names.items():
              data=(Path('dist')/filename).read_bytes()
              assert len(data)>10_000_000
              apks[abi]={
                  'url':'https://download.epimediahub.com/android/'+filename,
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'size':len(data)
              }
          manifest={
              'version':'1.0.71',
              'versionCode':1071,
              'notes':'v1.0.71: Automatische Bildratenanpassung für Live-TV (25/50 fps auf 50 Hz, 29.97/30 fps auf 59.94/60 Hz) und Filme/Serien (Cinema 23.976/24 Hz, optionaler 1080p-Fallback). Fire-TV-Fernbedienung: Beim Abspann mit Pfeil rechts zu Nächste Folge und per OK starten. EPG, VPN, Skins, Intro und Live-TV-Navigation bleiben erhalten. Abhängig von unterstützten TV-/Gerätemodi.',
              'apks':apks
          }
          for filename in ('latest.json','android-latest.json'):
              (Path('dist')/filename).write_text(
                  json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Promoting from',old_code,'to 1071; never changing updater until APK upload succeeds')
          PY

      - name: Upload all verified ABI variants to existing in-app-updater release
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/*.apk; do
            timeout 20m gh release upload "$TAG" "$asset" --repo "$REPO" --clobber
          done
          timeout 5m gh release upload "$TAG" dist/SHA256SUMS.txt --repo "$REPO" --clobber
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > published-assets.txt
          for filename in EpiMediaHub_Android_v1.0.71-arm64-v8a.apk \
            EpiMediaHub_Android_v1.0.71-armeabi-v7a.apk \
            EpiMediaHub_Android_v1.0.71-universal.apk \
            EpiMediaHub_Android_v0.7.0-test.apk; do
            grep -Fx "$filename" published-assets.txt
          done

      - name: Advance public updater only after verified APKs exist
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/$REPO/branches/release%2Fv171-official-inapp" --jq '.commit.sha')"
          test "$latest_sha" = "$GITHUB_SHA" || {
              echo "::error::Newer publisher candidate exists. Keeping previous updater."; exit 1;
          }
          mkdir -p right-before-publish
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir right-before-publish
          python3 - <<'PY'
          import json
          from pathlib import Path
          current=json.loads(Path('right-before-publish/latest.json').read_text())
          assert int(current['versionCode'])<1071, 'Newer or equal release already live'
          PY
          timeout 5m gh release upload "$TAG" dist/android-latest.json --repo "$REPO" --clobber
          timeout 5m gh release upload "$TAG" dist/latest.json --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" \
            --title 'EpiMediaHub Android v1.0.71 – Live, Cinema und Abspann-Fokus' \
            --notes 'v1.0.71 offizielles In-App-Update: Live-TV Bildratenanpassung (25/50 zu 50 Hz, 29.97/30 zu 59.94/60 Hz); Cinema-Bildtakt bei Filmen/Serien (23.976/24 Hz) und Fernbedienungsfokus Abspann überspringen ↔ Nächste Folge. Unterstützte Gerätemodi erforderlich. Signierte APKs unverändert aus verifiziertem QA-Lauf 38736292859.' \
            --prerelease
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > published-assets.txt
          for filename in EpiMediaHub_Android_v1.0.71-arm64-v8a.apk \
            EpiMediaHub_Android_v1.0.71-armeabi-v7a.apk \
            EpiMediaHub_Android_v1.0.71-universal.apk \
            latest.json android-latest.json; do
            grep -Fx "$filename" published-assets.txt
          done
          echo 'v1.0.71 official Android in-app updater published successfully.'
