name: Build signed EpiMediaHub Android v0.7.1 test

on:
  workflow_dispatch:
  push:
    branches: [android-v0.7.0-ui]
    paths:
      - '.github/workflows/android-release-v070.yml'
      - 'android/v0.7.0/**'
      - 'android/v0.7.1/**'
      - 'android/hotfixes/v064_xtream_hotfix15.py'
      - 'build_tools/install_android_v070_source.sh'
      - 'build_tools/install_android_v071_source.sh'

concurrency:
  group: epimediahub-android-v070-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-v070:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      TAILSCALE_ANDROID_SHA: c412dfe3b28ed7c5dd4de233149fa1bd55065dfd
    steps:
      - uses: actions/checkout@v4

      - name: Require permanent signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          EXPECTED="192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          ACTUAL="$(sha256sum .ci-android/source.tar.gz | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Pin Gradle toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF

      - name: Install v0.7.1 source
        run: bash build_tools/install_android_v071_source.sh

      - name: Import existing premium skin assets
        run: bash build_tools/import_enigma_v0941_android_assets.sh

      - name: Install permanent release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/epimediahub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias epimediahub >/dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['PROJECT_ROOT'])/'app/build.gradle.kts'
          s=p.read_text()
          anchor='    buildTypes {\n'
          signing='''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = "epimediahub"
                  keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
              }
          }

          '''
          if anchor not in s: raise SystemExit('buildTypes anchor missing')
          s=s.replace(anchor, signing+anchor, 1)
          s=s.replace('        release {\n            isMinifyEnabled = false','        release {\n            signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = false',1)
          p.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;23.1.7779620"

      - name: Restore embedded Tailscale runtime cache
        id: tailscale-cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/tailscale/${{ env.TAILSCALE_ANDROID_SHA }}
          key: epimediahub-tailscale-${{ runner.os }}-${{ env.TAILSCALE_ANDROID_SHA }}-ndk23.1-v1

      - name: Install cached Tailscale runtime
        if: steps.tailscale-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR=".ci-cache/tailscale/$TAILSCALE_ANDROID_SHA"
          mkdir -p "$PROJECT_ROOT/app/libs"
          cp "$CACHE_DIR/tailscale-embedded.aar" "$PROJECT_ROOT/app/libs/tailscale-embedded.aar"
          cp "$CACHE_DIR/libtailscale.aar" "$PROJECT_ROOT/app/libs/libtailscale.aar"

      - name: Build embedded official Tailscale runtime
        if: steps.tailscale-cache.outputs.cache-hit != 'true'
        run: bash build_tools/build_tailscale_embedded.sh

      - name: Stage embedded Tailscale runtime for cache
        if: steps.tailscale-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR=".ci-cache/tailscale/$TAILSCALE_ANDROID_SHA"
          mkdir -p "$CACHE_DIR"
          cp "$PROJECT_ROOT/app/libs/tailscale-embedded.aar" "$CACHE_DIR/tailscale-embedded.aar"
          cp "$PROJECT_ROOT/app/libs/libtailscale.aar" "$CACHE_DIR/libtailscale.aar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed v0.7.1 test APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify v0.7.1 and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionName = "0.7.1"' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'versionCode = 701' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'fun V070HomeScreen' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V070Home.kt"
          grep -Fq 'V070WeatherClient.refresh' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V070Home.kt"
          grep -Fq 'fun V070PlaylistsScreen' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V070Playlists.kt"
          grep -Fq 'OK · AUSWÄHLEN' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V070Playlists.kt"
          grep -Fq 'height(if (isTv) 68.dp else 78.dp)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/BrowserRows.kt"
          grep -Fq 'INTRO ÜBERSPRINGEN' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V070Intro.kt"
          grep -Fq 'id == "default" || id == "epi_blue" || id == "epi_red"' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/ThemeRepository.kt"
          grep -Fq 'android:banner="@drawable/tv_launcher_banner"' "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          grep -Fq 'releases/tags/v0.7.0-test' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/UpdateManager.kt"
          grep -Fq 'config.optJSONArray("playlists")' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/SetupCodeProvisioning.kt"
          grep -Fq 'private fun canonicalMpegTsLiveUrl(streamId: String)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/XtreamClient.kt"
          grep -Fq 'private fun V071CategoryRail(' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V060CinematicHub.kt"
          grep -Fq 'durationMillis = 145' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V060CinematicHub.kt"
          grep -Fq 'private fun V071UseVlcLiveFallback(item: MediaEntry)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'setEnableDecoderFallback(true)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'org.videolan.android:libvlc-all:3.6.5' "$PROJECT_ROOT/app/build.gradle.kts"
          APK="$PROJECT_ROOT/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          CERT="$(grep -i 'certificate SHA-256 digest:' /tmp/apk-signature.txt | head -n1 | awk -F': ' '{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "7939E7DDCBABA56F03D5FB0833D8A580B7797C12C4CCE378CA086C46F1B36D8E"

      - name: Prepare test files
        shell: bash
        run: |
          mkdir -p dist
          cp "$PROJECT_ROOT/app/build/outputs/apk/release/app-release.apk" dist/EpiMediaHub_Android_v0.7.0-test.apk
          sha256sum dist/EpiMediaHub_Android_v0.7.0-test.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub-Android-v0.7.1-signed-test
          path: |
            dist/EpiMediaHub_Android_v0.7.0-test.apk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish public GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.7.0-test"
          TITLE="EpiMediaHub Android v0.7.1 Test"
          NOTES="Android 0.7.1 ergänzt in Filme und Serien eine feste Kategorienleiste links neben der Netflix-Ansicht, reduziert die Poster-Zoombewegung für ein ruhigeres D-Pad-Navigieren und verbessert Live-TV-Audiokompatibilität: ExoPlayer nutzt Decoder-Fallback; explizit als RAW, HEVC oder H265 gekennzeichnete Live-Varianten werden über den integrierten LibVLC-Kompatibilitätsplayer wiedergegeben. HEVC selbst ist ein Videocodec; der Fallback zielt auf problematische Audio-/Mux-Kombinationen dieser Provider-Varianten. Alle Dashboard-0.7-, Multi-Playlist-, M3U- und 0.7.0-UI-Fixes bleiben enthalten."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "${GITHUB_SHA}"
          fi

          upload_asset() {
            local file="$1"
            local attempt
            for attempt in 1 2 3; do
              if timeout 12m gh release upload "$TAG" "$file" --clobber; then
                return 0
              fi
              echo "Release upload attempt $attempt failed for $file"
              sleep "$((attempt * 5))"
            done
            return 1
          }

          upload_asset dist/EpiMediaHub_Android_v0.7.0-test.apk
          upload_asset dist/SHA256SUMS.txt
