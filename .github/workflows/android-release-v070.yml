name: Build signed EpiMediaHub Android v0.7.4 test

on:
  workflow_dispatch:
  push:
    branches: [android-v0.7.0-ui]
    paths:
      - '.github/workflows/android-release-v070.yml'
      - 'android/v0.7.0/**'
      - 'android/v0.7.1/**'
      - 'android/v0.7.2/**'
      - 'android/v0.7.4/**'
      - 'android/hotfixes/v064_xtream_hotfix15.py'
      - 'build_tools/install_android_v070_source.sh'
      - 'build_tools/install_android_v071_source.sh'
      - 'build_tools/install_android_v072_source.sh'
      - 'build_tools/install_android_v074_source.sh'

concurrency:
  group: epimediahub-android-v070-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-v074:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require permanent signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          EXPECTED="192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          ACTUAL="$(sha256sum .ci-android/source.tar.gz | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Pin Gradle toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF

      - name: Install v0.7.4 source
        run: bash build_tools/install_android_v074_source.sh

      - name: Import existing premium skin assets
        run: bash build_tools/import_enigma_v0941_android_assets.sh

      - name: Install permanent release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/epimediahub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias epimediahub >/dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['PROJECT_ROOT'])/'app/build.gradle.kts'
          s=p.read_text()
          anchor='    buildTypes {\n'
          signing='''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = "epimediahub"
                  keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
              }
          }

          '''
          if anchor not in s: raise SystemExit('buildTypes anchor missing')
          s=s.replace(anchor, signing+anchor, 1)
          release='        release {\n'
          if release not in s: raise SystemExit('release build type missing')
          s=s.replace(release, release+'            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed v0.7.4 APKs
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify version, architecture and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionName = "0.7.3"' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'versionCode = 704' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'https://api.epimediahub.com' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/SetupCodeProvisioning.kt"
          grep -Fq 'https://download.epimediahub.com/android/latest.json' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/UpdateManager.kt"
          grep -Fq 'private fun V072UseVlcLiveFallback(item: MediaEntry)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'KeyEvent.KEYCODE_CHANNEL_UP' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'fun rememberedLibraryCategory(kind: MediaKind)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq 'MediaKind.LIVE -> "LIVE TV"' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V060CinematicHub.kt"
          grep -Fq 'RELEASE_API_URL' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/UpdateManager.kt"
          grep -Fq 'Lifecycle.Event.ON_START' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/EpiMediaHubApp.kt"
          grep -Fq 'org.videolan.android:libvlc-all:3.6.5' "$PROJECT_ROOT/app/build.gradle.kts"
          ! grep -Rq 'com.tailscale' "$PROJECT_ROOT/app/src/main"
          ! grep -Fq 'tailscale-embedded.aar' "$PROJECT_ROOT/app/build.gradle.kts"
          for APK in "$PROJECT_ROOT/app/build/outputs/apk/release/app-arm64-v8a-release.apk" "$PROJECT_ROOT/app/build/outputs/apk/release/app-armeabi-v7a-release.apk" "$PROJECT_ROOT/app/build/outputs/apk/release/app-universal-release.apk"
          do
            test -s "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
            CERT="$(grep -i 'certificate SHA-256 digest:' /tmp/apk-signature.txt | head -n1 | awk -F': ' '{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test "$CERT" = "7939E7DDCBABA56F03D5FB0833D8A580B7797C12C4CCE378CA086C46F1B36D8E"
          done

      - name: Prepare APKs and domain update manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PROJECT_ROOT/app/build/outputs/apk/release/app-arm64-v8a-release.apk" dist/EpiMediaHub_Android_v0.7.4-test-arm64-v8a.apk
          cp "$PROJECT_ROOT/app/build/outputs/apk/release/app-armeabi-v7a-release.apk" dist/EpiMediaHub_Android_v0.7.4-test-armeabi-v7a.apk
          cp "$PROJECT_ROOT/app/build/outputs/apk/release/app-universal-release.apk" dist/EpiMediaHub_Android_v0.7.4-test-universal.apk
          cp dist/EpiMediaHub_Android_v0.7.4-test-universal.apk dist/EpiMediaHub_Android_v0.7.0-test.apk
          SHA_ARM64="$(sha256sum dist/EpiMediaHub_Android_v0.7.4-test-arm64-v8a.apk | awk '{print $1}')"
          SHA_ARMV7="$(sha256sum dist/EpiMediaHub_Android_v0.7.4-test-armeabi-v7a.apk | awk '{print $1}')"
          SHA_UNIVERSAL="$(sha256sum dist/EpiMediaHub_Android_v0.7.4-test-universal.apk | awk '{print $1}')"
          SIZE_ARM64="$(stat -c %s dist/EpiMediaHub_Android_v0.7.4-test-arm64-v8a.apk)"
          SIZE_ARMV7="$(stat -c %s dist/EpiMediaHub_Android_v0.7.4-test-armeabi-v7a.apk)"
          SIZE_UNIVERSAL="$(stat -c %s dist/EpiMediaHub_Android_v0.7.4-test-universal.apk)"
          cat > dist/android-latest.json <<EOF
          {
            "version": "0.7.3",
            "versionCode": 704,
            "notes": "Live-TV mit einheitlicher Kategorieübersicht, gemerkter Kategorieposition und repariertem Senderwechsel. Der In-App-Updater nutzt EpiMediaHub-Domain plus GitHub-Fallback. Geräte-Kopplung, RAW/MP2-Audio-Fallback und Playlist-Aktualisierung bleiben enthalten.",
            "apks": {
              "arm64-v8a": {
                "url": "https://download.epimediahub.com/android/EpiMediaHub_Android_v0.7.4-test-arm64-v8a.apk",
                "sha256": "$SHA_ARM64",
                "size": $SIZE_ARM64
              },
              "armeabi-v7a": {
                "url": "https://download.epimediahub.com/android/EpiMediaHub_Android_v0.7.4-test-armeabi-v7a.apk",
                "sha256": "$SHA_ARMV7",
                "size": $SIZE_ARMV7
              },
              "universal": {
                "url": "https://download.epimediahub.com/android/EpiMediaHub_Android_v0.7.4-test-universal.apk",
                "sha256": "$SHA_UNIVERSAL",
                "size": $SIZE_UNIVERSAL
              }
            }
          }
          EOF
          cp dist/android-latest.json dist/latest.json
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub-Android-v0.7.4-signed-test
          path: dist/
          retention-days: 30

      - name: Publish public GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.7.0-test"
          TITLE="EpiMediaHub Android v0.7.4 Test"
          NOTES="Android 0.7.3 entfernt Tailscale vollständig aus der App, erzeugt eine private zufällige Installations-ID und koppelt Geräte per kurzlebigem 8-stelligem Code mit dem Kundendashboard. API und zukünftige Updates laufen über epimediahub.com. Separate ARM64- und ARMv7-APKs reduzieren den Speicherbedarf; ein Universal-APK bleibt für das Update von 0.7.2 erhalten. Der RAW/MP2-LibVLC-Fallback und die Playlist-Aktualisierung aus 0.7.2 bleiben enthalten. Im Dashboard ist außerdem das bestätigte Löschen eines Kunden samt zugehörigen Geräten und Aktivierungscodes ergänzt."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "${GITHUB_SHA}"
          fi
          for file in dist/*; do
            timeout 12m gh release upload "$TAG" "$file" --clobber
          done
