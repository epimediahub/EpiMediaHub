name: Build signed EpiMediaHub Android v0.9.3 test

on:
  workflow_dispatch:
  push:
    branches: [android-v0.7.0-ui]
    paths:
      - '.github/workflows/android-release-v070.yml'
      - 'android/v0.7.0/**'
      - 'android/v0.7.1/**'
      - 'android/v0.7.2/**'
      - 'android/v0.8.0/**'
      - 'android/v0.8.1/**'
      - 'android/v0.8.2/**'
      - 'android/v0.8.3/**'
      - 'android/v0.8.4/**'
      - 'android/v0.8.6/**'
      - 'android/v0.8.7/**'
      - 'android/v0.8.8/**'
      - 'android/v0.8.9/**'
      - 'android/v0.9.0/**'
      - 'android/v0.9.1/**'
      - 'android/v0.9.2/**'
      - 'android/v0.9.3/**'
      - 'android/hotfixes/v064_xtream_hotfix15.py'
      - 'build_tools/install_android_v070_source.sh'
      - 'build_tools/install_android_v071_source.sh'
      - 'build_tools/install_android_v072_source.sh'
      - 'build_tools/install_android_v080_source.sh'
      - 'build_tools/install_android_v081_source.sh'
      - 'build_tools/install_android_v082_source.sh'
      - 'build_tools/install_android_v083_source.sh'
      - 'build_tools/install_android_v084_source.sh'
      - 'build_tools/install_android_v086_source.sh'
      - 'build_tools/install_android_v087_source.sh'
      - 'build_tools/install_android_v088_source.sh'
      - 'build_tools/install_android_v089_source.sh'
      - 'build_tools/install_android_v090_source.sh'
      - 'build_tools/install_android_v091_source.sh'
      - 'build_tools/install_android_v092_source.sh'
      - 'build_tools/install_android_v093_source.sh'

concurrency:
  group: epimediahub-android-v070-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-v093:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require permanent signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          EXPECTED="192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          ACTUAL="$(sha256sum .ci-android/source.tar.gz | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Pin Gradle toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF

      - name: Install v0.9.3 source
        run: bash build_tools/install_android_v093_source.sh

      - name: Import existing premium skin assets
        run: bash build_tools/import_enigma_v0941_android_assets.sh

      - name: Install permanent release signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/epimediahub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias epimediahub >/dev/null
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['PROJECT_ROOT'])/'app/build.gradle.kts'
          s=p.read_text()
          anchor='    buildTypes {\n'
          signing='''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = "epimediahub"
                  keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
              }
          }

          '''
          if anchor not in s: raise SystemExit('buildTypes anchor missing')
          s=s.replace(anchor, signing+anchor, 1)
          release='        release {\n'
          if release not in s: raise SystemExit('release build type missing')
          s=s.replace(release, release+'            signingConfig = signingConfigs.getByName("release")\n', 1)
          p.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed v0.9.3 APKs
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify version, architecture and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionName = "0.9.3"' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'versionCode = 903' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'https://api.epimediahub.com' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/SetupCodeProvisioning.kt"
          grep -Fq 'https://download.epimediahub.com/android/latest.json' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/UpdateManager.kt"
          grep -Fq 'private fun V072UseVlcLiveFallback(item: MediaEntry)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'RAW|HEVC|H\.?265|MP2|MPGA' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'tracks.isTypeSupported(C.TRACK_TYPE_AUDIO)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'Audio-Kompatibilität' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'media.setHWDecoderEnabled(true, false)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V088VlcVideo.kt"
          grep -Fq -- '--no-mediacodec-audio' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V088VlcVideo.kt"
          ! grep -Eq 'clock-jitter=0|clock-synchro=0' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V088VlcVideo.kt"
          grep -Fq -- '--audio-replay-gain-mode=none' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V088VlcVideo.kt"
          grep -Fq 'KeyEvent.KEYCODE_CHANNEL_UP' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'fun rememberedLibraryCategory(kind: MediaKind)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq 'fun V076LiveTvScreen' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V076LiveTv.kt"
          grep -Fq 'data object Revoked' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/SetupCodeProvisioning.kt"
          grep -Fq 'config.optJSONArray("playlists")' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/SetupCodeProvisioning.kt"
          grep -Fq 'repo.savePlaylists(emptyList())' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/SetupCodeProvisioning.kt"
          grep -Fq 'if (!dashboardPaired)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/EpiMediaHubApp.kt"
          grep -Fq 'fun V078DashboardPairingGate' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V078DashboardPairingGate.kt"
          grep -Fq 'ANDROID MOBILE · 0.9.3' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V078DashboardPairingGate.kt"
          grep -Fq 'fun V083HomeScreen' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V083Home.kt"
          grep -Fq 'ANDROID TV · 0.9.3' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V083Home.kt"
          grep -Fq 'targetValue = if (focused) 1.025f else 1f' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V083Home.kt"
          grep -Fq 'targetValue = if (focused) 1.035f else 1f' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V060CinematicHub.kt"
          grep -Fq 'targetValue = if (focused) 1.012f else 1f' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V076LiveTv.kt"
          ! grep -Fq 'LaunchedEffect(visibleCategories, selectedCategoryId, categoryStartIndex)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V060CinematicHub.kt"
          ! grep -Fq 'LaunchedEffect(selectedId, channels.size)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V076LiveTv.kt"
          grep -Fq 'onBack != null && !isTvDevice' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/Common.kt"
          grep -Fq 'V081WeatherSettingsCard(accent)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/Screens.kt"
          grep -Fq 'val addedAt: Long = 0L' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/model/Models.kt"
          grep -Fq 'MediaCategory("__recently_added__", "Zuletzt hinzugefügt")' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq 'val unlocked = prefs.familySkinsUnlocked()' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq 'Dauerhaft freigeschaltet' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V079Themes.kt"
          ! grep -Fq '"GERÄT & DASHBOARD"' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V083Home.kt"
          grep -Fq 'fun V079ThemesScreen' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V079Themes.kt"
          grep -Fq 'PRIVATE DESIGNS' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V079Themes.kt"
          grep -Fq 'val city: String' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/V070WeatherClient.kt"
          grep -Fq 'Accept-Language' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/V070WeatherClient.kt"
          grep -Fq 'fun lockPrivateSkins()' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq 'railState.scrollToItem(selectedIndex)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V076LiveTv.kt"
          grep -Fq '"GERÄT & DASHBOARD"' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V070Home.kt"
          grep -Fq 'Kopplungscode erzeugen' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V047WebAdmin.kt"
          grep -Fq 'RELEASE_API_URL' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/UpdateManager.kt"
          grep -Fq 'Lifecycle.Event.ON_START' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/EpiMediaHubApp.kt"
          grep -Fq 'keepAwakeView.keepScreenOn = true' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'onDispose { keepAwakeView.keepScreenOn = previousKeepScreenOn }' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'org.videolan.android:libvlc-all:3.6.5' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'androidx.media3:media3-exoplayer:1.9.4' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'androidx.media3:media3-exoplayer-hls:1.9.4' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'androidx.media3:media3-ui:1.9.4' "$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'var useVlc by remember(item.resumeKey, item.streamUrl) { mutableStateOf(false) }' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          ! grep -Fq 'mutableStateOf(V072UseVlcLiveFallback(item))' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'private var searchJob: kotlinx.coroutines.Job? = null' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq 'kotlinx.coroutines.delay(320)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq 'localRows.asSequence()' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq '.take(120)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq 'Staffel $season' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/Screens.kt"
          grep -Fq 'vm.play(e,orderedEpisodes)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/Screens.kt"
          grep -Fq 'categoryId = firstNonBlank(seriesInfo.optString("name"), seriesInfo.optString("title"))' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/XtreamClient.kt"
          grep -Fq 'val ordered = episodeList.sortedWith(' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq 'delay(if (item.kind == MediaKind.LIVE) 4500 else 3500)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'useController = item.kind != MediaKind.LIVE && !(isTv && item.kind == MediaKind.EPISODE)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'KeyEvent.KEYCODE_DPAD_LEFT -> if (item.kind == MediaKind.LIVE) switchLiveBy(-1) else { seekBy(-10_000L); true }' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'val seriesTitle = item.categoryId.ifBlank { "Serie" }' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'val needsCompatibilityPlayer = hasVideo || !hasAudio || !player.isPlaying' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'compatibilityUrl = playbackUrls.getOrNull(attempt).orEmpty()' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'else if (item.kind == MediaKind.LIVE && !manualPlayerChoice)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          ! grep -Fq 'if (false && item.kind == MediaKind.LIVE)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'distinctBy { continueIdentity(it.media) }' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/PrefsRepository.kt"
          grep -Fq 'fun setCategoryVisible(kind: MediaKind, categoryId: String, visible: Boolean)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          grep -Fq 'V093ContinueLabel(c)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/Screens.kt"
          grep -Fq 'infoByKey = continueItems.associate' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V060CinematicHub.kt"
          grep -Fq 'u.hiddenCategoryIds' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V076LiveTv.kt"
          grep -Fq 'if (item.kind != MediaKind.LIVE && controls)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          grep -Fq 'V093FormatTime(position)' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          ! grep -Rq 'com.tailscale' "$PROJECT_ROOT/app/src/main"
          ! grep -Fq 'tailscale-embedded.aar' "$PROJECT_ROOT/app/build.gradle.kts"
          for APK in "$PROJECT_ROOT/app/build/outputs/apk/release/app-arm64-v8a-release.apk" "$PROJECT_ROOT/app/build/outputs/apk/release/app-armeabi-v7a-release.apk" "$PROJECT_ROOT/app/build/outputs/apk/release/app-universal-release.apk"
          do
            test -s "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
            CERT="$(grep -i 'certificate SHA-256 digest:' /tmp/apk-signature.txt | head -n1 | awk -F': ' '{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test "$CERT" = "7939E7DDCBABA56F03D5FB0833D8A580B7797C12C4CCE378CA086C46F1B36D8E"
          done

      - name: Prepare APKs and domain update manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PROJECT_ROOT/app/build/outputs/apk/release/app-arm64-v8a-release.apk" dist/EpiMediaHub_Android_v0.9.3-test-arm64-v8a.apk
          cp "$PROJECT_ROOT/app/build/outputs/apk/release/app-armeabi-v7a-release.apk" dist/EpiMediaHub_Android_v0.9.3-test-armeabi-v7a.apk
          cp "$PROJECT_ROOT/app/build/outputs/apk/release/app-universal-release.apk" dist/EpiMediaHub_Android_v0.9.3-test-universal.apk
          cp dist/EpiMediaHub_Android_v0.9.3-test-universal.apk dist/EpiMediaHub_Android_v0.7.0-test.apk
          SHA_ARM64="$(sha256sum dist/EpiMediaHub_Android_v0.9.3-test-arm64-v8a.apk | awk '{print $1}')"
          SHA_ARMV7="$(sha256sum dist/EpiMediaHub_Android_v0.9.3-test-armeabi-v7a.apk | awk '{print $1}')"
          SHA_UNIVERSAL="$(sha256sum dist/EpiMediaHub_Android_v0.9.3-test-universal.apk | awk '{print $1}')"
          SIZE_ARM64="$(stat -c %s dist/EpiMediaHub_Android_v0.9.3-test-arm64-v8a.apk)"
          SIZE_ARMV7="$(stat -c %s dist/EpiMediaHub_Android_v0.9.3-test-armeabi-v7a.apk)"
          SIZE_UNIVERSAL="$(stat -c %s dist/EpiMediaHub_Android_v0.9.3-test-universal.apk)"
          cat > dist/android-latest.json <<EOF
          {
            "version": "0.9.3",
            "versionCode": 903,
            "notes": "Android 0.9.3 zeigt pro Serie nur die zuletzt gesehene Folge in Weiterschauen, ergänzt Staffel/Folge/Restzeit, ausblendbare Kategorien und eine sichtbare Zeit-/Seek-Anzeige für Filme und Serien.",
            "apks": {
              "arm64-v8a": {
                "url": "https://download.epimediahub.com/android/EpiMediaHub_Android_v0.9.3-test-arm64-v8a.apk",
                "sha256": "$SHA_ARM64",
                "size": $SIZE_ARM64
              },
              "armeabi-v7a": {
                "url": "https://download.epimediahub.com/android/EpiMediaHub_Android_v0.9.3-test-armeabi-v7a.apk",
                "sha256": "$SHA_ARMV7",
                "size": $SIZE_ARMV7
              },
              "universal": {
                "url": "https://download.epimediahub.com/android/EpiMediaHub_Android_v0.9.3-test-universal.apk",
                "sha256": "$SHA_UNIVERSAL",
                "size": $SIZE_UNIVERSAL
              }
            }
          }
          EOF
          python3 - <<'PYVERIFY'
          import hashlib, json, os, re
          from pathlib import Path
          build = (Path(os.environ['PROJECT_ROOT']) / 'app/build.gradle.kts').read_text()
          manifest = json.loads(Path('dist/android-latest.json').read_text())
          assert manifest['version'] == re.search(r'versionName = "([^"]+)"', build).group(1)
          assert manifest['versionCode'] == int(re.search(r'versionCode = (\d+)', build).group(1))
          for apk in manifest['apks'].values():
              path = Path('dist') / apk['url'].rsplit('/', 1)[-1]
              assert path.stat().st_size == apk['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == apk['sha256']
          print('Updater version, APK sizes and SHA-256 verified')
          PYVERIFY
          cp dist/android-latest.json dist/latest.json
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub-Android-v0.9.3-signed-test
          path: dist/
          retention-days: 30

      - name: Publish public GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.7.0-test"
          TITLE="EpiMediaHub Android v0.9.3 Test"
          NOTES="Android 0.9.3: Weiterschauen zeigt pro Serie nur die zuletzt gesehene Folge mit Staffel, Folge und Restminuten. Kategorien lassen sich pro Playlist und Bereich ausblenden. Filme und Serien zeigen beim Spulen eine eigene Zeitleiste mit aktueller Zeit, Gesamtdauer und Restzeit. Die 0.9.2 Live-TV-Fallback-Logik bleibt erhalten."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --target "${GITHUB_SHA}"
          fi
          # Publish metadata only after all APKs are downloadable by the Pi sync.
          for file in dist/*.apk dist/SHA256SUMS.txt; do
            timeout 12m gh release upload "$TAG" "$file" --clobber
          done
          timeout 12m gh release upload "$TAG" dist/android-latest.json dist/latest.json --clobber
