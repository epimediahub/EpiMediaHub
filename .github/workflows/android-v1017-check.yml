name: Check Android v1.0.17 player layout, intro focus and credits countdown

on:
  push:
    branches: [android-v1.0.17-dev]
    paths:
      - '.github/workflows/android-v1017-check.yml'
      - 'android/v1.0.17/**'
      - 'build_tools/install_android_v1017_source.sh'
      - 'build_tools/generate_intro_sound_v109.py'
  workflow_dispatch:

concurrency:
  group: epimediahub-android-v1017-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Pin Gradle toolchain
        shell: bash
        run: |
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF
      - name: Install v1.0.17 source
        run: |
          bash build_tools/install_android_v1017_source.sh
          grep -Fq 'https://download.epimediahub.com/android/latest.json' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/UpdateManager.kt"
          grep -Fq 'releases/tags/v0.7.0-test' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/UpdateManager.kt"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
      - name: Verify complete VOD layouts, intro focus, credits autoplay and existing navigation
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          gradle :app:testDebugUnitTest --stacktrace --no-daemon -Dorg.gradle.workers.max=2
      - name: Preserve navigation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-v1017-test-reports
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/reports/tests/testDebugUnitTest
            ${{ env.PROJECT_ROOT }}/app/build/test-results/testDebugUnitTest
            ${{ env.PROJECT_ROOT }}/app/build/reports/ui
          if-no-files-found: ignore
      - name: Build debug APKs
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify API 25 player layout, intro focus and credits countdown
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk/debug" -name 'app-armeabi-v7a-debug.apk' | head -n1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|native-code:"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "sdkVersion:'25'"

      - name: Verify DASH and HLS classes in debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk/debug" -name 'app-armeabi-v7a-debug.apk' | head -n1)"
          test -s "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only "$APK" > /tmp/media3-debug-packages.txt
          grep -F 'androidx.media3.exoplayer.dash.DashMediaSource$Factory' /tmp/media3-debug-packages.txt
          grep -F 'androidx.media3.exoplayer.hls.HlsMediaSource$Factory' /tmp/media3-debug-packages.txt
