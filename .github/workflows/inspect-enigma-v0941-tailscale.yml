name: Inspect Enigma v0.9.41 Tailscale

on:
  push:
    paths:
      - 'build_tools/inspect_v0941_tailscale.sh'
      - '.github/workflows/inspect-enigma-v0941-tailscale.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v0.9.41 Tailscale code
        shell: bash
        run: bash build_tools/inspect_v0941_tailscale.sh
