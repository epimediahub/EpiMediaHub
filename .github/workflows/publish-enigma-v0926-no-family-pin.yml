name: Publish Enigma v0.9.26 No Family PIN

on:
  push:
    branches: [ main ]
    paths:
      - 'build_tools/build_v0926_remove_family_pin.sh'
      - '.github/workflows/publish-enigma-v0926-no-family-pin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.26
        run: bash build_tools/build_v0926_remove_family_pin.sh
