name: EpiScene audio cache retention regression
on:
  push:
    paths:
      - "tools/episcene-learning-v1/cache-retention/**"
      - ".github/workflows/episcene-audio-cache-retention.yml"
  pull_request:
    paths:
      - "tools/episcene-learning-v1/cache-retention/**"
      - ".github/workflows/episcene-audio-cache-retention.yml"
  workflow_dispatch:
jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned audio-window retention tests
        working-directory: tools/episcene-learning-v1/cache-retention
        run: |
          python3 -m py_compile audio_cache_patch.py test_audio_cache_patch.py install_audio_cache_retention.py
          python3 -m unittest -v test_audio_cache_patch.py
