name: Credits 1.0.20 Raspberry compatibility

on:
  pull_request:
    branches: [raspberry-v0.8.3-credits]
    paths:
      - '.github/workflows/credits-v120-check.yml'
      - 'server/epimediahub_provisioning/**'
  push:
    branches: [raspberry-v0.8.3-credits]
    paths:
      - '.github/workflows/credits-v120-check.yml'
      - 'server/epimediahub_provisioning/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  credits-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing server dependencies
        run: python -m pip install -r server/epimediahub_provisioning/requirements.txt 'numpy>=1.26,<3'
      - name: Restore the existing installed detector from its pinned repository payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          root = Path('server/epimediahub_provisioning')
          installer = (root / 'deploy/install_skip_detector_v3_1.sh').read_text()
          encoded = re.search(r"PAYLOAD='([^']+)'", installer).group(1)
          (root / 'skip_detector_v3.py').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
      - name: Rebuild and verify embedded credit installer
        run: |
          python server/epimediahub_provisioning/deploy/rebuild_credits_payload.py
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'server/epimediahub_provisioning/deploy')
          import install_credits_v120 as installer
          root=Path('server/epimediahub_provisioning')
          for path, content in installer.payload().items():
              assert (root/path).read_text()==content, path
          PY
      - name: Save refreshed installer in internal PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/admin-free-lifetime-grants'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'server/epimediahub_provisioning/deploy/install_credits_v120.py';
            const branch = 'feature/admin-free-lifetime-grants';
            const {owner,repo} = context.repo;
            const desired = fs.readFileSync(path);
            const current = await github.rest.repos.getContent({owner,repo,path,ref:branch});
            if (Array.isArray(current.data)) throw new Error('Expected installer file');
            const present = Buffer.from(current.data.content, 'base64');
            if (!desired.equals(present)) {
              await github.rest.repos.createOrUpdateFileContents({
                owner,repo,path,branch,sha:current.data.sha,
                message:'build(license): synchronize integrity-checked free grant installer',
                content:desired.toString('base64')
              });
            }
      - name: Verify prices, migration, isolation and credit transactions
        run: python server/epimediahub_provisioning/tests/test_credit_pricing.py
      - name: Verify snapshot preflight, embedded payload and file rollback
        run: python server/epimediahub_provisioning/tests/test_credit_installer.py
      - name: Verify existing reseller workflows and limits
        env:
          EPIMEDIAHUB_EXPECTED_API_VERSION: '0.8.2'
        run: python server/epimediahub_provisioning/tests/smoke_v080.py
