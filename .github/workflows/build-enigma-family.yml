name: Build Enigma Family One-File

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-enigma-family.yml'
      - 'tools/build_family_release.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout EpiMediaHub
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libcairo2 git curl
          python -m pip install --upgrade pip
          python -m pip install pillow cairosvg

      - name: Fetch authentic football and car logo collections
        run: |
          git clone --depth 1 https://github.com/JoseArroyave/football-logos.git /tmp/football-logos
          git clone --depth 1 https://github.com/vehiclespecs/brand-logos.git /tmp/car-logos

      - name: Fetch fixed authentic fashion logos
        run: |
          mkdir -p /tmp/fashion-logos
          curl -fL --retry 3 -A 'EpiMediaHub-private-family-build/0.9.9' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Gucci_logo.svg' \
            -o /tmp/fashion-logos/gucci.svg
          curl -fL --retry 3 -A 'EpiMediaHub-private-family-build/0.9.9' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Louis_Vuitton_SVG_Monogram_Logo.svg' \
            -o /tmp/fashion-logos/louis_vuitton.svg
          curl -fL --retry 3 -A 'EpiMediaHub-private-family-build/0.9.9' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Prada-Logo.svg' \
            -o /tmp/fashion-logos/prada.svg
          curl -fL --retry 3 -A 'EpiMediaHub-private-family-build/0.9.9' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Versace-3.svg' \
            -o /tmp/fashion-logos/versace.svg
          file /tmp/fashion-logos/*
          test -s /tmp/fashion-logos/gucci.svg
          test -s /tmp/fashion-logos/louis_vuitton.svg
          test -s /tmp/fashion-logos/prada.svg
          test -s /tmp/fashion-logos/versace.svg

      - name: Build EpiMediaHub v0.9.9
        run: |
          python tools/build_family_release.py \
            --base EpiMediaHub_v0.9.8.ipk \
            --football-root /tmp/football-logos/logos \
            --car-root /tmp/car-logos \
            --fashion-root /tmp/fashion-logos \
            --output EpiMediaHub_v0.9.9.ipk
          sha256sum EpiMediaHub_v0.9.9.ipk
          ar t EpiMediaHub_v0.9.9.ipk

      - name: Upload one-file IPK
        uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub_v0.9.9_onefile
          path: |
            EpiMediaHub_v0.9.9.ipk
            EpiMediaHub_v0.9.9.ipk.sha256
          if-no-files-found: error
          retention-days: 30
