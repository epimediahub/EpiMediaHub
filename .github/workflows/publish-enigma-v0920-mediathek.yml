name: Publish Enigma v0.9.20 Mediathek

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-enigma-v0920-mediathek.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Fix Mediathek asset check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build_tools/build_v0920_mediathek.sh')
          t = p.read_text(encoding='utf-8')
          t = t.replace('grep -q home_mediathek "$PLUGIN"', 'test -f "$ROOT/home_mediathek.png"')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Build and publish v0.9.20 Mediathek
        shell: bash
        run: bash -x build_tools/build_v0920_mediathek.sh
