name: Publish Enigma v0.9.20 Mediathek

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-enigma-v0920-mediathek.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Build and publish v0.9.20 Mediathek
        shell: bash
        run: bash build_tools/build_v0920_mediathek.sh
