name: Publish Enigma v0.9.35 Web Playlist Setup

on:
  push:
    branches: [ main ]
    paths:
      - 'build_tools/build_v0935_web_playlist_setup.sh'
      - '.github/workflows/publish-enigma-v0935-web-playlist-setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.35
        run: bash build_tools/build_v0935_web_playlist_setup.sh
