name: Publish Enigma v0.9.42 Mediathek Open Fix

on:
  push:
    paths:
      - 'build_tools/build_v0942_mediathek_open_fix.sh'
      - '.github/workflows/publish-enigma-v0942-mediathek-open-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish v0.9.42
        shell: bash
        run: bash build_tools/build_v0942_mediathek_open_fix.sh
