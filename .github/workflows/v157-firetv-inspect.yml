name: v157 Fire TV player source inspection
on:
  push:
    branches: [fix/v157-firetv-live-stall]
    paths: ['.github/workflows/v157-firetv-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact private v156 production-derived source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 -d .ci-android/source.b64 > .ci-android/source.tar.gz
          test "$(sha256sum .ci-android/source.tar.gz | awk '{print $1}')" = "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c"
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          export PROJECT_ROOT
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_ROOT"
          bash build_tools/install_android_v1033_source.sh
          python3 android/v1.0.34-vpn/patch_wireguard_spike.py
          python3 android/v1.0.34-vpn/patch_playlist_routing.py
          for n in 149 150 151 152 153 154 155 156; do
            v=$((n-100))
            python3 "android/v1.0.$v/patch_v$n.py"
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path(os.environ["PROJECT_ROOT"])/"app/src/main/java/de/epimediahub/app"
          targets=[
             (src/"ui/PlayerScreen.kt",[(60,84),(240,277),(340,511)]),
             (src/"data/V155ExactM3uLive.kt",[(1,5)]),
             (src/"ui/V088VlcVideo.kt",[(1,110)]),
          ]
          for file,spans in targets:
            lines=file.read_text().splitlines()
            print("###",file.name)
            for a,b in spans:
              for n in range(a,min(len(lines),b)+1):
                print(f"{n}: {lines[n-1]}")
          PY
