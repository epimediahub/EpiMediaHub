name: Publish Enigma v0.9.23 World Mediathek
on:
  push:
    branches: [main]
    paths:
      - 'build_tools/build_v0923_mediathek_world.sh'
      - '.github/workflows/publish-enigma-v0923-world-mediathek.yml'
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.23
        shell: bash
        run: bash build_tools/build_v0923_mediathek_world.sh