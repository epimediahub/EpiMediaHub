name: Inspect Android v0.8.9 temporary

on:
  workflow_dispatch:
  push:
    branches: [android-v0.7.0-ui]
    paths:
      - '.github/workflows/inspect-android-v089-temp.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          echo "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c  .ci-android/source.tar.gz" | sha256sum -c -
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Install v0.8.9 source
        run: bash build_tools/install_android_v089_source.sh
      - name: Inspect targets
        shell: bash
        run: |
          set -euo pipefail
          JAVA="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app"
          echo '=== BUILD GRADLE ==='
          cat "$PROJECT_ROOT/app/build.gradle.kts"
          echo '=== PLAYER SCREEN ==='
          cat "$JAVA/ui/PlayerScreen.kt"
          echo '=== SEARCH REFERENCES ==='
          grep -Rni -E 'Search|search|query|Such|filter' "$JAVA" | head -n 1200 || true
          echo '=== MAIN VIEW MODEL ==='
          cat "$JAVA/MainViewModel.kt"
          echo '=== SCREENS ==='
          cat "$JAVA/ui/Screens.kt"
          echo '=== CINEMATIC HUB ==='
          cat "$JAVA/ui/V060CinematicHub.kt"
