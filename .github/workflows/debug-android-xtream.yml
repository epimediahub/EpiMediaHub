name: Debug reconstructed Android Xtream source

on:
  push:
    branches: [android-v0.6.0-cinematic-ui]
    paths:
      - '.github/workflows/debug-android-xtream.yml'

permissions:
  contents: read

jobs:
  dump-xtream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Apply current v0.6.4 source and hotfix2
        run: |
          bash build_tools/install_android_v064_source.sh
          python3 android/hotfixes/v064_xtream_hotfix2.py
      - name: Validate hotfix2
        shell: bash
        run: |
          set -euo pipefail
          X="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/XtreamClient.kt"
          G="$PROJECT_ROOT/app/build.gradle.kts"
          H="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/V044Home.kt"
          grep -Fq 'versionName = "0.6.4.2"' "$G"
          grep -Fq 'versionCode = 605' "$G"
          grep -Fq '0.6.4.2' "$H"
          grep -Fq 'apiWithEndpoint("panel_api.php"' "$X"
          grep -Fq 'val all = arrayAction(action)' "$X"
          grep -Fq 'row.optString("category_id") == requestedCategory' "$X"
          grep -Fq 'Xtream ${safeRequestName(current)} HTTP $code' "$X"
          grep -n -A65 -B10 'private fun apiWithEndpoint' "$X"
          grep -n -A45 -B8 'fun entries' "$X"
