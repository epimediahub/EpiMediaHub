name: Debug reconstructed Android Xtream source

on:
  push:
    branches: [android-v0.6.0-cinematic-ui]
    paths:
      - '.github/workflows/debug-android-xtream.yml'

permissions:
  contents: read

jobs:
  dump-xtream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Apply current v0.6.4.2 source
        run: bash build_tools/install_android_v064_source.sh
      - name: Dump live playback and list loading logic
        shell: bash
        run: |
          set -euo pipefail
          X="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/XtreamClient.kt"
          P="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          V="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          echo '--- Xtream entries / M3U loading ---'
          grep -n -A95 -B15 'fun entries' "$X" || true
          grep -n -A45 -B10 'private fun exactM3uStreamUrls' "$X" || true
          echo '--- Player playback URLs / errors / retries ---'
          grep -n -A220 -B40 'fun PlayerScreen' "$P" || true
          echo '--- ViewModel playbackUrls ---'
          grep -n -A70 -B15 'fun playbackUrls' "$V" || true
          grep -n 'playbackUrls\|playbackError\|onPlayerError\|STATE_READY\|STATE_BUFFERING\|setMediaItem\|prepare()' "$P" "$V" || true
