name: Debug reconstructed Android Xtream source

on:
  push:
    branches: [android-v0.6.0-cinematic-ui]
    paths:
      - '.github/workflows/debug-android-xtream.yml'

permissions:
  contents: read

jobs:
  dump-xtream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Apply current Android source
        run: bash build_tools/install_android_v06414_source.sh
      - name: Dump M3U, provisioning and catalog source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app"
          echo '===== M3uParser.kt ====='
          cat "$ROOT/data/M3uParser.kt"
          echo '===== SetupCodeProvisioning.kt ====='
          cat "$ROOT/data/SetupCodeProvisioning.kt"
          echo '===== MainViewModel catalog functions ====='
          grep -n -A220 -B40 -E 'loadCatalogRows|xtreamLibrary|openContent|loadCategories|loadItems' "$ROOT/MainViewModel.kt" || true
          echo '===== V060CinematicHub catalog ====='
          grep -n -A260 -B50 -E 'catalogRows|V060Poster|AsyncImage|CircularProgressIndicator|loading' "$ROOT/ui/V060CinematicHub.kt" || true
          echo '===== PrefsRepository playlists ====='
          grep -n -A180 -B30 -E 'loadPlaylists|savePlaylists|activePlaylistId' "$ROOT/data/PrefsRepository.kt" || true
