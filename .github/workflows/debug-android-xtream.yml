name: Debug reconstructed Android Xtream source

on:
  push:
    branches: [android-v0.6.0-cinematic-ui]
    paths:
      - '.github/workflows/debug-android-xtream.yml'

permissions:
  contents: read

jobs:
  dump-xtream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Apply current Android source
        run: bash build_tools/install_android_v064_source.sh
      - name: Dump playlist switch and VOD/series state logic
        shell: bash
        run: |
          set -euo pipefail
          VM="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          echo '--- MainViewModel playlist/catalog functions ---'
          grep -n -A90 -B25 'fun selectPlaylist\|fun loadCategories\|fun loadCatalogRows\|fun loadItems\|fun search\|catalogRows\|contentFilterKind' "$VM" || true
          echo '--- Xtream VOD/series requests ---'
          X="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/XtreamClient.kt"
          grep -n -A100 -B25 'fun categories\|fun entries\|get_vod_streams\|get_series\|category_id' "$X" || true
          echo '--- UI movie/series/catalog usage ---'
          grep -Rni -A80 -B20 'catalogRows\|contentFilterKind\|MediaKind.MOVIE\|MediaKind.SERIES' "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui" || true
