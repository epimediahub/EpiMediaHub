name: Debug reconstructed Android Xtream source

on:
  push:
    branches: [android-v0.6.0-cinematic-ui]
    paths:
      - '.github/workflows/debug-android-xtream.yml'

permissions:
  contents: read

jobs:
  dump-xtream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Apply current Android source
        run: bash build_tools/install_android_v064_source.sh
      - name: Dump Live TV navigation and remote-key logic
        shell: bash
        run: |
          set -euo pipefail
          VM="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainViewModel.kt"
          PLAYER="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/PlayerScreen.kt"
          APP="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/EpiMediaHubApp.kt"
          SCREENS="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/Screens.kt"
          echo '--- MainViewModel navigation/play ---'
          grep -n -A120 -B35 'fun navigate\|fun back()\|fun play(\|fun loadItems\|rememberBrowserPosition\|browserPosition\|browserSelectedId' "$VM" || true
          echo '--- PlayerScreen key handling ---'
          grep -n -A180 -B60 'onKeyEvent\|onPreviewKeyEvent\|KeyEvent\|KEYCODE_DPAD_UP\|KEYCODE_DPAD_DOWN\|skipEpisode\|onBack' "$PLAYER" || true
          echo '--- App player wiring/back handling ---'
          grep -n -A120 -B40 'PlayerScreen\|Screen.Player\|BackHandler\|vm.back\|onBack' "$APP" || true
          echo '--- Item list focus/click wiring ---'
          grep -n -A130 -B50 'ItemsScreen\|rememberBrowserPosition\|browserSelectedId\|onPlay\|onItem' "$SCREENS" || true
