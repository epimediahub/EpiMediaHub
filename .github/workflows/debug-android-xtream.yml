name: Debug reconstructed Android Xtream source

on:
  push:
    branches: [android-v0.6.0-cinematic-ui]
    paths:
      - '.github/workflows/debug-android-xtream.yml'

permissions:
  contents: read

jobs:
  dump-xtream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Apply current Android source
        run: bash build_tools/install_android_v064_source.sh
      - name: Dump playlist startup and remote setup focus code
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PROJECT_ROOT/app/src/main/java/de/epimediahub/app"
          echo '===== activePlaylistId references ====='
          grep -Rni -A30 -B30 'activePlaylistId' "$ROOT" || true
          echo '===== playlist screen references ====='
          grep -Rni -E -A160 -B40 'Playlist.*Screen|PLAYLIST|Playlist auswählen|Playlist wechseln|selectPlaylist' "$ROOT/ui" || true
          echo '===== remote/web admin screen ====='
          grep -Rni -E -A220 -B40 'Fernwart|DASHBOARD|showDashboardPin|showRemoteUnlock|Remote' "$ROOT/ui/V047WebAdmin.kt" || true
          echo '===== dashboard keypad ====='
          sed -n '1,300p' "$ROOT/ui/V051DashboardConnect.kt" || true
