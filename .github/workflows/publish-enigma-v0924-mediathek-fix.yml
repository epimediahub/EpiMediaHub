name: Publish Enigma v0.9.24 Mediathek Fix

on:
  push:
    branches: [ main ]
    paths:
      - 'build_tools/build_v0924_mediathek_metadata_exitfix.sh'
      - '.github/workflows/publish-enigma-v0924-mediathek-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish v0.9.24
        run: bash build_tools/build_v0924_mediathek_metadata_exitfix.sh
