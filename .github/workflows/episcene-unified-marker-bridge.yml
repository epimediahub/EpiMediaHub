name: EpiScene unified marker bridge tests
on:
  pull_request:
    paths:
      - 'tools/episcene-learning-v1/unified-marker-bridge/**'
      - '.github/workflows/episcene-unified-marker-bridge.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/episcene-learning-v1/unified-marker-bridge/**'
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and isolated regression tests
        working-directory: tools/episcene-learning-v1/unified-marker-bridge
        run: |
          python3 -m py_compile bridge.py runtime_integration.py preflight_live.py inspect_live_marker_contract.py test_bridge.py test_runtime_integration.py test_preflight_live.py test_inspect_live_marker_contract.py inspect_active_lookup_contract.py test_inspect_active_lookup_contract.py
          python3 -m unittest -v test_bridge.py test_runtime_integration.py test_preflight_live.py test_inspect_live_marker_contract.py test_inspect_active_lookup_contract.py
          bash -n install_unified.sh bootstrap_unified.sh
