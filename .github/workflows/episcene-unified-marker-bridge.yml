name: EpiScene unified marker bridge tests
on:
  pull_request:
    paths:
      - 'tools/episcene-learning-v1/unified-marker-bridge/**'
      - '.github/workflows/episcene-unified-marker-bridge.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/episcene-learning-v1/unified-marker-bridge/**'
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and isolated regression tests
        working-directory: tools/episcene-learning-v1/unified-marker-bridge
        run: |
          python3 -m py_compile bridge.py runtime_integration.py preflight_live.py inspect_live_marker_contract.py test_bridge.py test_runtime_integration.py test_preflight_live.py test_inspect_live_marker_contract.py inspect_active_lookup_contract.py test_inspect_active_lookup_contract.py check_lookup_release_gate.py test_check_lookup_release_gate.py trusted_external.py test_trusted_external.py trusted_external_sync.py test_trusted_external_sync.py analysis_identity.py test_analysis_identity.py lookup_augmentation.py test_lookup_augmentation.py inspect_lookup_redacted.py test_inspect_lookup_redacted.py production_lookup_cache.py test_production_lookup_cache.py patch_live_lookup.py canary_trusted_lookup.py test_canary_trusted_lookup.py
          python3 -m unittest -v test_bridge.py test_runtime_integration.py test_preflight_live.py test_inspect_live_marker_contract.py test_inspect_active_lookup_contract.py test_check_lookup_release_gate.py test_trusted_external.py test_trusted_external_sync.py test_analysis_identity.py test_lookup_augmentation.py test_inspect_lookup_redacted.py test_production_lookup_cache.py test_canary_trusted_lookup.py
          bash -n install_unified.sh bootstrap_unified.sh install_trusted_external.sh bootstrap_trusted_external.sh install_existing_identity_fix.sh bootstrap_existing_identity_fix.sh bootstrap_lookup_canary.sh
