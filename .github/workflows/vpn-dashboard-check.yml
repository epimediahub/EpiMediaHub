name: VPN dashboard and Finland agent checks
on:
  pull_request:
    branches: [fix/vpn-dashboard-device-identity, feature/vpn-auto-server]
    paths:
      - server/epimediahub_provisioning/**
      - .github/workflows/vpn-dashboard-check.yml
  push:
    branches: [feature/vpn-dashboard]
    paths:
      - server/epimediahub_provisioning/**
      - .github/workflows/vpn-dashboard-check.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r server/epimediahub_provisioning/requirements.txt playwright==1.51.0
      - name: VPN routes, billing, agent and installer regression tests
        run: python -m unittest discover -s server/epimediahub_provisioning/tests -p 'test_vpn_*.py' -v
      - name: Existing customer and reseller dashboard
        env:
          EPIMEDIAHUB_EXPECTED_API_VERSION: '0.8.2'
        run: python server/epimediahub_provisioning/tests/smoke_v080.py
      - name: Rebuild release installers from the same sources being tested
        run: |
          python server/epimediahub_provisioning/deploy/build_vpn_installers.py
          bash -n server/epimediahub_provisioning/deploy/install_vpn_dashboard.sh
          bash -n server/epimediahub_provisioning/deploy/install_vpn_finland_agent.sh
      - name: Persist regenerated installers to internal change branch
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/vpn-auto-server') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/vpn-auto-server')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'feature/vpn-auto-server';
            const {owner,repo} = context.repo;
            for (const path of [
              'server/epimediahub_provisioning/deploy/install_vpn_dashboard.sh',
              'server/epimediahub_provisioning/deploy/install_vpn_finland_agent.sh'
            ]) {
              const desired = fs.readFileSync(path);
              const current = await github.rest.repos.getContent({owner,repo,path,ref:branch});
              if (Array.isArray(current.data)) throw new Error('Expected installer file');
              const present = Buffer.from(current.data.content,'base64');
              if (!desired.equals(present)) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,repo,path,branch,sha:current.data.sha,
                  content:desired.toString('base64'),
                  message:'build(vpn): refresh integrity-checked dashboard device ID installer'
                });
              }
            }
      - name: Device ID must always be visible with custom device names
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("server/epimediahub_provisioning/templates")
          for name in ("dashboard_v080.html","reseller_dashboard_v080.html"):
              text=(root/name).read_text()
              assert "<strong>Feste Geräte-ID:</strong>" in text
              assert '<code title="Diese ID gehört zur App-Registrierung dieses Geräts">{{ device.device_id }}</code>' in text
          assert "Geräte-ID: {{ d.device_id }}" in (root/"vpn_dashboard.html").read_text()
          PY
      - name: Browser layout and interaction checks
        env:
          VPN_PREVIEW_DIR: vpn-dashboard-preview
        run: python server/epimediahub_provisioning/tests/render_vpn_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpn-dashboard-preview
          path: vpn-dashboard-preview/
          if-no-files-found: ignore
