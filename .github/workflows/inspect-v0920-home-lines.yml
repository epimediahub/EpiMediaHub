name: Inspect v0.9.20 home line numbers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v0920-home-lines.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        shell: bash
        run: |
          set -euo pipefail
          P=inspection/plugin_v0920.py
          {
            grep -nE 'class .*Home|tile0|openSearch|EpiSearch|HOME_SKIN|def keyOK|def ok|self\.tiles|home_' "$P" || true
          } > inspection/v0920-home-lines.txt
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection/v0920-home-lines.txt
          git commit -m 'Inspect v0.9.20 home line numbers'
          git push
