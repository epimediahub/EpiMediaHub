name: Build EpiMediaHub Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/v0.3.0/**'
      - '.github/workflows/android-apk.yml'
      - 'EpiMediaHub_v0.9.7.ipk'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Gradle project shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          echo "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c  .ci-android/source.tar.gz" | sha256sum -c -
          tar -xzf .ci-android/source.tar.gz -C .ci-android
          PROJECT_ROOT="$(find .ci-android -maxdepth 4 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_ROOT"

      - name: Pin Android Gradle and Kotlin toolchain
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PROJECT_ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > "$PROJECT_ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EpiMediaHubAndroid"
          include(":app")
          EOF

      - name: Install complete v0.3.0 application source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_ROOT/app/src/main/java"
          rm -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          cp -a android/v0.3.0/app/. "$PROJECT_ROOT/app/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['PROJECT_ROOT']) / 'app/src/main/java/de/epimediahub/app/ui/Screens.kt'
          s = p.read_text()
          s = s.replace('onClick={if(kind==MediaKind.SERIES){{vm.navigate(Screen.Episodes(m))}}else{{vm.play(m)}}}', 'onClick={if(kind==MediaKind.SERIES) vm.navigate(Screen.Episodes(m)) else vm.play(m)}')
          s = s.replace('onClick={if(m.kind==MediaKind.SERIES){{vm.navigate(Screen.Episodes(m))}}else{{vm.play(m)}}}', 'onClick={if(m.kind==MediaKind.SERIES) vm.navigate(Screen.Episodes(m)) else vm.play(m)}')
          s = s.replace('LinearProgressIndicator({it},Modifier.fillMaxWidth().padding(top=6.dp))', 'LinearProgressIndicator(progress={it},modifier=Modifier.fillMaxWidth().padding(top=6.dp))')
          p.write_text(s)
          PY
          test -f "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/MainActivity.kt"
          test -f "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/ui/Screens.kt"
          test -f "$PROJECT_ROOT/app/src/main/java/de/epimediahub/app/data/LocalWebAdmin.kt"

      - name: Import 59 themes and EpiMediaHub artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android/ipk
          cd .ci-android/ipk
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.7.ipk"
          tar -xzf data.tar.gz
          PLUGIN="$PWD/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub"
          APP="$GITHUB_WORKSPACE/$PROJECT_ROOT/app/src/main"
          DRAW="$APP/res/drawable-nodpi"
          mkdir -p "$DRAW" "$APP/res/raw"

          for file in "$PLUGIN"/themes/*.png; do name="$(basename "$file")"; cp "$file" "$DRAW/theme_$name"; done
          for file in "$PLUGIN"/themes/marks/*.png; do name="$(basename "$file")"; cp "$file" "$DRAW/mark_$name"; done
          cp "$PLUGIN/themes/catalog.json" "$APP/res/raw/theme_catalog.json"

          cp "$PLUGIN/header.png" "$DRAW/brand_header.png"
          cp "$PLUGIN/header.png" "$DRAW/tv_banner.png"
          cp "$PLUGIN/plugin.png" "$DRAW/app_icon.png"
          cp "$PLUGIN/splash.png" "$DRAW/splash.png"
          cp "$PLUGIN/home_live.png" "$DRAW/icon_live.png"
          cp "$PLUGIN/home_movies.png" "$DRAW/icon_movies.png"
          cp "$PLUGIN/home_series.png" "$DRAW/icon_series.png"
          cp "$PLUGIN/home_search.png" "$DRAW/icon_search.png"
          cp "$PLUGIN/home_settings.png" "$DRAW/icon_settings.png"
          cp "$PLUGIN/home_playlist.png" "$DRAW/icon_playlist.png"

          themes=$(find "$DRAW" -maxdepth 1 -type f -name 'theme_*.png' | wc -l)
          marks=$(find "$DRAW" -maxdepth 1 -type f -name 'mark_*.png' | wc -l)
          echo "Theme backgrounds: $themes; marks: $marks"
          test "$themes" -eq 59
          test "$marks" -eq 59

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" dist/EpiMediaHub_Android_v0.3.0-debug.apk
          cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" dist/EpiMediaHub-Android.apk
          sha256sum dist/EpiMediaHub_Android_v0.3.0-debug.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub-Android-v0.3.0-debug
          path: |
            dist/EpiMediaHub_Android_v0.3.0-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable Downloader APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-latest"
          ASSET="dist/EpiMediaHub-Android.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "EpiMediaHub Android v0.3.0" --notes "Modernized rounded Android TV/mobile UI, direct Xtream credential entry and local PIN-protected PC browser playlist management. Stable Downloader URL unchanged."
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "EpiMediaHub Android v0.3.0" --notes "Modernized rounded Android TV/mobile UI, direct Xtream credential entry and local PIN-protected PC browser playlist management. Stable Downloader URL unchanged."
          fi

      - name: Show stable Downloader URL
        run: echo "https://github.com/epimediahub/EpiMediaHub/releases/download/android-latest/EpiMediaHub-Android.apk"
