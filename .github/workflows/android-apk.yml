name: Build EpiMediaHub Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/source_parts/**'
      - '.github/workflows/android-apk.yml'
      - 'EpiMediaHub_v0.9.7.ipk'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android v0.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android
          cat android/source_parts/source_* > .ci-android/source.b64
          base64 --decode .ci-android/source.b64 > .ci-android/source.tar.gz
          echo "192960b4363b3b9db132442d003717d3767f5c56e1b20b996cfb67e41656808c  .ci-android/source.tar.gz" | sha256sum -c -
          tar -xzf .ci-android/source.tar.gz -C .ci-android

      - name: Align Java and Kotlin to JVM 17
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.ci-android/EpiMediaHubAndroid/app/build.gradle.kts')
          s = p.read_text()
          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              needle = '    buildFeatures { compose = true }\n'
              insert = '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

          '''
              if needle not in s:
                  raise SystemExit('buildFeatures anchor not found')
              s = s.replace(needle, insert + needle)
              p.write_text(s)
          print(p.read_text())
          PY

      - name: Import the 59 EpiMediaHub themes from Enigma2 v0.9.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-android/ipk
          cd .ci-android/ipk
          ar x "$GITHUB_WORKSPACE/EpiMediaHub_v0.9.7.ipk"
          tar -xzf data.tar.gz

          PLUGIN="$PWD/usr/lib/enigma2/python/Plugins/Extensions/EpiMediaHub"
          APP="$GITHUB_WORKSPACE/.ci-android/EpiMediaHubAndroid/app/src/main"
          DRAW="$APP/res/drawable-nodpi"
          mkdir -p "$DRAW" "$APP/assets"

          for file in "$PLUGIN"/themes/*.png; do
            name="$(basename "$file")"
            cp "$file" "$DRAW/theme_$name"
          done
          for file in "$PLUGIN"/themes/marks/*.png; do
            name="$(basename "$file")"
            cp "$file" "$DRAW/theme_mark_$name"
          done

          cp "$PLUGIN/themes/catalog.json" "$APP/assets/theme_catalog.json"
          cp "$PLUGIN/plugin.png" "$DRAW/epimediahub_icon.png"
          cp "$PLUGIN/header.png" "$DRAW/tv_banner.png"

          themes=$(find "$DRAW" -maxdepth 1 -type f -name 'theme_*.png' ! -name 'theme_mark_*.png' | wc -l)
          marks=$(find "$DRAW" -maxdepth 1 -type f -name 'theme_mark_*.png' | wc -l)
          echo "Theme backgrounds: $themes"
          echo "Theme marks: $marks"
          test "$themes" -eq 59
          test "$marks" -eq 59

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: .ci-android/EpiMediaHubAndroid
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .ci-android/EpiMediaHubAndroid/app/build/outputs/apk/debug/app-debug.apk dist/EpiMediaHub_Android_v0.2.0-debug.apk
          cp .ci-android/EpiMediaHubAndroid/app/build/outputs/apk/debug/app-debug.apk dist/EpiMediaHub-Android.apk
          sha256sum dist/EpiMediaHub_Android_v0.2.0-debug.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpiMediaHub-Android-v0.2.0-debug
          path: |
            dist/EpiMediaHub_Android_v0.2.0-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable Downloader APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-latest"
          ASSET="dist/EpiMediaHub-Android.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" \
              --title "EpiMediaHub Android v0.2.0" \
              --notes "Stable direct APK endpoint for Android TV, Google TV and Android mobile. The asset filename stays unchanged so Downloader links/codes can keep pointing to the same URL."
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "EpiMediaHub Android v0.2.0" \
              --notes "Stable direct APK endpoint for Android TV, Google TV and Android mobile. The asset filename stays unchanged so Downloader links/codes can keep pointing to the same URL."
          fi

      - name: Show stable Downloader URL
        shell: bash
        run: |
          echo "https://github.com/epimediahub/EpiMediaHub/releases/download/android-latest/EpiMediaHub-Android.apk"
