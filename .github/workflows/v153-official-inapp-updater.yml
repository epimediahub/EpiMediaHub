name: Publish official EpiMediaHub v1.0.53 in-app update

on:
  push:
    branches: [fix/v153-direct-playlist-regression]
    paths: ['.github/workflows/v153-official-inapp-updater.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: epimediahub-android-rolling-updater
  cancel-in-progress: false

jobs:
  publish-tested-apks:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: epimediahub/EpiMediaHub
      TAG: v0.7.0-test
      QA_SHA: ${{ github.sha }}
      QA_ARTIFACT: EpiMediaHub-Official-v1.0.53-adaptive-private-qa
    steps:
      - uses: actions/checkout@v4

      - name: Gate publication on two signed-source-matching regression QA results
        shell: bash
        run: |
          set -euo pipefail
          # This release run and BOTH source/APK QA runs MUST refer to the exact
          # same immutable commit. Otherwise never advance the in-app updater.
          BRANCH="fix/v153-direct-playlist-regression"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git rev-parse HEAD)" = "$QA_SHA"
          for workflow in android-v153-source-qa.yml android-v153-official-qa.yml; do
            finished=0
            for attempt in $(seq 1 110); do
              if ! gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=$BRANCH&per_page=50" > matching-runs.json; then
                sleep 20
                continue
              fi
              run=$(jq -r --arg sha "$QA_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")][0].id // empty' matching-runs.json)
              if [ -z "$run" ]; then
                sleep 20
                continue
              fi
              gh api "repos/$REPO/actions/runs/$run" > verified-run.json
              jq -e --arg sha "$QA_SHA" --arg branch "$BRANCH" '.head_sha == $sha and .head_branch == $branch' verified-run.json > /dev/null
              if jq -e '.status == "completed" and .conclusion == "success"' verified-run.json >/dev/null; then
                if [ "$workflow" = "android-v153-official-qa.yml" ]; then
                  echo "QA_RUN=$run" >> "$GITHUB_ENV"
                fi
                finished=1
                break
              fi
              if jq -e '.status == "completed" and .conclusion != "success"' verified-run.json >/dev/null; then
                echo "::error::$workflow failed; public updater preserved at previous version"
                exit 1
              fi
              sleep 20
            done
            test "$finished" -eq 1 || { echo "::error::QA gate timed out, updater unchanged"; exit 1; }
          done
          echo 'v1.0.53 source and signed APK tests passed on identical commit.'

      - name: Download only the artifact from verified official APK build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa dist
          gh run download "$QA_RUN" --repo "$REPO" --name "$QA_ARTIFACT" --dir qa
          (cd qa && sha256sum -c SHA256SUMS.txt)
          for pair in \
            'arm64-v8a:ARM64' 'armeabi-v7a:ARMv7' 'universal:Universal'; do
            ABI="${pair%%:*}"
            LABEL="${pair#*:}"
            SOURCE="qa/EpiMediaHub-Official-v1.0.53-$LABEL-PILOT.apk"
            TARGET="dist/EpiMediaHub_Android_v1.0.53-$ABI.apk"
            test -s "$SOURCE"
            test "$(stat -c %s "$SOURCE")" -gt 10000000
            cp "$SOURCE" "$TARGET"
          done
          cp dist/EpiMediaHub_Android_v1.0.53-universal.apk dist/EpiMediaHub_Android_v0.7.0-test.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Refuse downgrades; prepare exact hashes and new updater manifest
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" >/dev/null
          mkdir -p previous
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir previous
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          previous=json.loads(Path('previous/latest.json').read_text())
          existing=int(previous.get('versionCode',0))
          if existing >= 1053:
              raise SystemExit(f'Updater already at versionCode {existing}; refusing non-monotonic replacement.')
          expected = {
              'arm64-v8a': 'EpiMediaHub_Android_v1.0.53-arm64-v8a.apk',
              'armeabi-v7a': 'EpiMediaHub_Android_v1.0.53-armeabi-v7a.apk',
              'universal': 'EpiMediaHub_Android_v1.0.53-universal.apk'
          }
          apks={}
          for abi, filename in expected.items():
              path=Path('dist')/filename
              assert path.stat().st_size > 10_000_000
              apks[abi]={
                  'url': 'https://download.epimediahub.com/android/'+filename,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'size': path.stat().st_size
              }
          update={
              'version':'1.0.53',
              'versionCode':1053,
              'notes':'v1.0.53: DIREKT-Playlists funktionieren ohne externen IP-Prüfdienst, nachdem der App-VPN-Tunnel sicher getrennt wurde. VPN-geschützte Playlists bleiben ohne bestätigtes VPN gesperrt. Speedtest, Wetter, Standort und Schnellmenü erhalten.',
              'apks':apks
          }
          for filename in ('latest.json','android-latest.json'):
              (Path('dist')/filename).write_text(json.dumps(update,ensure_ascii=False,indent=2)+'\n')
          print('Publication validated; existing code:',existing,'new: 1053')
          PY

      - name: Upload three verified APK variants before publishing manifests
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/*.apk; do
            timeout 20m gh release upload "$TAG" "$asset" --repo "$REPO" --clobber
          done
          timeout 5m gh release upload "$TAG" dist/SHA256SUMS.txt --repo "$REPO" --clobber
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > observed-assets.txt
          for filename in \
            EpiMediaHub_Android_v1.0.53-arm64-v8a.apk \
            EpiMediaHub_Android_v1.0.53-armeabi-v7a.apk \
            EpiMediaHub_Android_v1.0.53-universal.apk; do
            grep -Fx "$filename" observed-assets.txt
          done

      - name: Advance public updater only after assets are live in release
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m gh release upload "$TAG" dist/android-latest.json --repo "$REPO" --clobber
          timeout 5m gh release upload "$TAG" dist/latest.json --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" \
            --title 'EpiMediaHub Android v1.0.53' \
            --notes 'EpiMediaHub v1.0.53: offizielles, signiertes und geprüftes Direkt-Playlist-Hotfix-Update. Kein externer IP-Prüfdienst mehr als Voraussetzung bei explizit ausgeschaltetem VPN. WireGuard-Tunnel und Prozessbindung werden vor Direktfreigabe geprüft; VPN-Playlists bleiben geschützt. Speedtest, Wetter, Standort, Schnellmenü, EpiScene, Registrierungen und vorhandene Playlist-Einstellungen bleiben erhalten.' \
            --prerelease
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > published-assets.txt
          for filename in EpiMediaHub_Android_v1.0.53-arm64-v8a.apk \
            EpiMediaHub_Android_v1.0.53-armeabi-v7a.apk \
            EpiMediaHub_Android_v1.0.53-universal.apk latest.json android-latest.json; do
            grep -Fx "$filename" published-assets.txt
          done
          echo 'EpiMediaHub v1.0.53 now published via official rolling updater.'
